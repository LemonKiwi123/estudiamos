<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Estudiamos move</title></head>
<body>
<script src="syncmerge.js"></script>
<script>
'use strict';
/* Helper page: the old copy of Estudiamos (opened from a file) hands its data to this page, which passes it to the PC server.
   It only works with the one-time code that "Start Estudiamos" wrote for this move. */
const nonce = location.hash.slice(1);
const tell = msg => parent.postMessage(msg, '*');
addEventListener('message', async e => {
  const m = e.data;
  if (!m || m.type !== 'estudiar-migrate' || m.nonce !== nonce || !nonce) return;
  try {
    const hdr = { 'Content-Type': 'application/json', 'X-Estudiar-Token': nonce };
    const r = await fetch('/api/migrate', { method: 'POST', headers: hdr, body: JSON.stringify({ profiles: m.profiles, states: m.states }) });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    let n = 0; const keys = Object.keys(m.media || {});
    for (const k of keys) {
      const b = m.media[k]; if (!(b instanceof Blob)) continue;
      const h = SyncCore.fnvHash(new Uint8Array(await b.arrayBuffer()));
      await fetch(`/api/media/${encodeURIComponent(k)}?h=${h}&ts=${Date.now()}`, { method: 'PUT', headers: { 'Content-Type': b.type || 'application/octet-stream' }, body: b });
      tell({ type: 'estudiar-migrate-progress', done: ++n, total: keys.length });
    }
    await fetch('/api/migrate-done', { method: 'POST', headers: hdr });
    tell({ type: 'estudiar-migrate-done', ok: true });
  } catch (err) { tell({ type: 'estudiar-migrate-done', ok: false, error: String(err.message || err) }); }
});
tell({ type: 'estudiar-migrate-ready' });
</script>
</body></html>
