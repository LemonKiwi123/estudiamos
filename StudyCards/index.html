/* ---------- Lexicon Saga windows (classic dark-blue boxes with white borders) ---------- */
.sg-screen{background:#000}
.ng-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ng-modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:6px}
.ng-mode{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;text-align:left;padding:10px 12px;border:2px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit}
.ng-mode span{grid-row:span 2;font-size:24px;align-self:center}.ng-mode small{color:var(--muted)}
.ng-mode.on{border-color:var(--accent);background:var(--accent-soft)}
.ng-chip{display:inline-block;margin:2px 4px;padding:1px 8px;border-radius:99px;background:var(--surface2)}
.ng-sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:10px 0}
.ng-sheet.abc{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.ng-cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit}
.ng-cell b{font-size:18px}.ng-cell span{font-size:13px;text-align:center}.ng-cell small{color:var(--again);font-size:11px}
.ng-review{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;text-align:center}
.ng-card{max-width:620px;margin:10px auto;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ng-prompt{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:90px;justify-content:center}
.ng-big{font-size:64px;font-weight:800;line-height:1.1}.ng-big.word{font-size:34px}
.ng-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.ng-opt{padding:14px 10px;border:2px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-family:inherit;font-weight:600;font-size:20px;line-height:1.25;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.ng-opt kbd{font-size:11px;opacity:.6}
.ng-opt.right{border-color:var(--good);background:var(--ok-bg)}.ng-opt.wrong{border-color:var(--again);background:var(--bad-bg)}.ng-opt.dim{opacity:.45}
.ng-verdict{font-size:18px}.ng-verdict.ok{color:var(--good)}.ng-verdict.no{color:var(--again)}
.ng-typeform{display:flex;gap:8px;width:100%}.ng-typeform input{flex:1;font-size:20px;padding:10px 12px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--text)}
.ng-spell{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.ng-spell i{font-style:normal;font-weight:800;font-size:22px;padding:2px 8px;border-radius:6px;background:var(--surface2)}
@media (max-width:520px){ .ng-big{font-size:52px} .ng-opt{font-size:17px} }
.sg-box{position:absolute;left:5px;right:5px;bottom:5px;max-height:calc(100% - 10px);overflow-y:auto;background:#0a1450;color:#fff;border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 2px #0a1450;padding:9px 11px;font:600 15px/1.4 ui-monospace,Consolas,monospace;display:none}
.sg-box.open{display:block}
.sg-box.big{top:5px}
.sg-box.low{max-height:46%}
.sg-box b{color:#f4c542}
.sg-text{padding-right:24px}
.sg-next{position:absolute;right:8px;bottom:6px;border:0;background:none;color:#fff;font-size:15px;cursor:pointer;animation:trBlink 1s steps(2) infinite}
.sg-mtitle{font-size:13px;margin-bottom:6px;color:#dfe6ff}
.sg-mtitle small{color:#aab7ff}
.sg-menu{display:grid;grid-template-columns:1fr;gap:2px}
.sg-menu.two{grid-template-columns:1fr 1fr}
.sg-mi{display:flex;align-items:flex-start;gap:6px;text-align:left;border:0;background:none;color:#fff;padding:4px 4px;font:inherit;font-size:14px;cursor:pointer;border-radius:4px}
.sg-mi .sg-cur{visibility:hidden;color:#fff;flex:none}
.sg-mi.sel .sg-cur{visibility:visible;animation:trBlink 1s steps(2) infinite}
.sg-mi.sel{background:rgba(255,255,255,.08)}
.sg-mi:disabled{opacity:.4;cursor:default}
.sg-ml{display:flex;flex-direction:column;gap:1px}
.sg-ml small{font-size:11px;font-weight:500;color:#c8d0ff}
.sg-back{margin-top:6px;border:0;background:none;color:#c8d0ff;font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.sg-q{display:flex;flex-direction:column;gap:8px}
.sg-prompt{display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:800;text-align:center;padding:6px;border:2px solid #fff;border-radius:6px;background:#122070}
.sg-prompt .icon-btn{color:#fff}
.sg-timer{height:4px;background:#25348a;border-radius:2px;overflow:hidden}
.sg-timer>div{height:100%;background:#f4c542;animation:trTime linear forwards}
.sg-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sg-opt{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid #fff;background:#0a1450;color:#fff;border-radius:6px;padding:8px;font:inherit;font-size:14px;cursor:pointer;overflow-wrap:anywhere}
.sg-opt kbd{margin:0;background:#fff;color:#0a1450;border-color:#fff}
.sg-opt:hover:not(:disabled){background:#1b2b8f}
.sg-opt.right{background:#1e8449;border-color:#7dcea0}
.sg-opt.wrong{background:#922b21;border-color:#f1948a}
.sg-opt.dim{opacity:.45}
.sg-typeform{display:flex;gap:6px}
.sg-say{display:flex;flex-direction:column;align-items:center;gap:6px}
.sg-mic{font:inherit;font-size:16px;font-weight:700;padding:8px 18px;border-radius:6px;border:2px solid #fff;background:#f4c542;color:#0a1450;cursor:pointer}
.sg-mic.on{background:#e74c3c;color:#fff;animation:sgPulse 1s infinite}
@keyframes sgPulse{50%{opacity:.7}}
.sg-lvl-row{display:flex;align-items:center;gap:6px;width:86%} .sg-lvl-row>span{font-size:14px}
.sg-lvl{flex:1;height:12px;border:2px solid #fff;border-radius:6px;overflow:hidden;background:rgba(0,0,0,.35)}
.sg-lvl i{display:block;height:100%;width:0;background:#5fe08a;transition:width .08s,background-color .2s}
.sg-live{font-size:13px;min-height:1.3em;text-align:center}
.sg-saytype{font:inherit;font-size:12px;background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;opacity:.85}
.sg-typeform input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border-radius:6px;border:2px solid #fff;background:#fff;color:#0a1450}
.sg-cast{border:2px solid #fff;background:#8e44ad;color:#fff;border-radius:6px;font:inherit;font-weight:800;padding:0 12px;cursor:pointer}
.sg-cast:disabled{opacity:.5}
.sg-verdict{font-size:14px}
.sg-chip{font-size:12px;background:var(--surface2);border-radius:99px;padding:2px 8px}
/* ---------- Wordling Trails ---------- */
.tr-wrap{--g0:#e0ecc0;--g1:#a8c66c;--g2:#5a8a4a;--g3:#1f3a2b;display:flex;flex-direction:column;align-items:center;gap:12px}
/* Wordling Trails handheld shell (original design in the spirit of an old pocket console) */
.tr-console{--shell:#cfccc2;--shell-d:#b3b0a6;--bez:#5c5e70;--navy:#2c2f6d;--plum:#9a2257;position:relative;width:min(100%,560px,max(320px,calc((100vh - 440px) * 1.11 + 100px)));min-width:min(100%,300px);background:linear-gradient(180deg,#d8d5cb,var(--shell) 40%,#c6c3b8);border-radius:14px 14px 64px 14px;padding:16px 18px 22px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -5px 0 rgba(0,0,0,.12),inset -4px 0 0 rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none}
.tr-console::before{content:"";position:absolute;left:14px;right:14px;top:8px;height:0;border-top:2px solid rgba(0,0,0,.1);box-shadow:0 1px 0 rgba(255,255,255,.5)}
.tr-bezel{background:var(--bez);border-radius:10px 10px 44px 10px;padding:8px 26px 20px 8px;margin-top:6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.tr-bezel-top{display:flex;align-items:center;gap:6px;margin:0 0 8px 22px;font:700 8px/1 system-ui,sans-serif;letter-spacing:.12em;color:#c3c4d2;white-space:nowrap;overflow:hidden}
.tr-bezel-top::before,.tr-bezel-top::after{content:"";flex:1;min-width:10px;height:6px;border-top:2px solid var(--plum);border-bottom:2px solid var(--navy)}
.tr-bezel-top span{flex:none;text-overflow:ellipsis;overflow:hidden}
.tr-bezel-row{display:flex;align-items:center;gap:6px}
.tr-led{flex:none;width:18px;display:flex;flex-direction:column;align-items:center;gap:4px;align-self:flex-start;margin-top:30%}
.tr-led i{width:8px;height:8px;border-radius:50%;background:#e8352c;box-shadow:0 0 6px 1px rgba(255,70,50,.8),inset 0 -1px 1px rgba(0,0,0,.3)}
.tr-led span{font:700 6px system-ui,sans-serif;letter-spacing:.05em;color:#c3c4d2;writing-mode:vertical-rl;transform:rotate(180deg)}
.tr-screen-wrap{position:relative;flex:1;min-width:0}
.tr-screen{display:block;width:100%;aspect-ratio:160/144;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--g0);border-radius:2px;box-shadow:0 0 0 2px #3e404f,inset 0 0 10px rgba(0,0,0,.3)}
.tr-brand{margin:10px 0 0 4px;color:var(--navy);line-height:1}
.tr-brand b{font:italic 800 20px/1 "Trebuchet MS",system-ui,sans-serif;letter-spacing:-.01em}
.tr-brand span{font:800 15px/1 system-ui,sans-serif;letter-spacing:.08em}
.tr-pad{display:grid;grid-template-columns:1fr auto;grid-template-areas:"dpad ab" "mid mid";align-items:center;gap:14px 8px;margin-top:18px;padding:0 4px 26px;touch-action:none}
.tr-wrap.pad-off .tr-pad{display:none!important}
.tr-wrap.pad-off .tr-console{padding-bottom:30px}
.tr-pad button{-webkit-tap-highlight-color:transparent;touch-action:none;cursor:pointer;padding:0}
.tr-dpad{grid-area:dpad;justify-self:start;margin-left:6px;display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.tr-dpad button,.tr-dpad-mid{border:0;background:#26262b;position:relative}
.tr-dpad button:active{background:#3a3a42}
.tr-dpad button::after{content:"";position:absolute;left:50%;top:50%;border:6px solid transparent;transform:translate(-50%,-50%);opacity:.55}
.tr-dpad [data-trdir=up]{grid-column:2;grid-row:1;border-radius:5px 5px 0 0}.tr-dpad [data-trdir=up]::after{border-bottom-color:#55555e;margin-top:-3px}
.tr-dpad [data-trdir=left]{grid-column:1;grid-row:2;border-radius:5px 0 0 5px}.tr-dpad [data-trdir=left]::after{border-right-color:#55555e;margin-left:-3px}
.tr-dpad-mid{grid-column:2;grid-row:2;display:block}.tr-dpad-mid::after{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#1b1b1f,#303036)}
.tr-dpad [data-trdir=right]{grid-column:3;grid-row:2;border-radius:0 5px 5px 0}.tr-dpad [data-trdir=right]::after{border-left-color:#55555e;margin-left:3px}
.tr-dpad [data-trdir=down]{grid-column:2;grid-row:3;border-radius:0 0 5px 5px}.tr-dpad [data-trdir=down]::after{border-top-color:#55555e;margin-top:3px}
.tr-ab{grid-area:ab;display:flex;gap:16px;align-items:flex-start;transform:rotate(-25deg);background:rgba(0,0,0,.07);border-radius:40px;padding:8px 10px 4px;margin-right:6px;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.tr-ab>div:first-child{margin-top:16px}
.tr-ab>div,.tr-mid>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.tr-ab span{font:italic 800 13px system-ui,sans-serif;color:var(--navy);letter-spacing:.05em}
.tr-ab button{width:52px;height:52px;border-radius:50%;border:0;background:radial-gradient(circle at 38% 32%,#b9357a,var(--plum) 60%,#7c1a45);box-shadow:0 4px 0 #5c1233,0 5px 6px rgba(0,0,0,.25)}
.tr-ab button:active{transform:translateY(3px);box-shadow:0 1px 0 #5c1233}
.tr-mid{grid-area:mid;display:flex;justify-content:center;gap:22px;padding-right:20px}
.tr-mid>div{transform:rotate(-25deg)}
.tr-mid span{font:800 9px system-ui,sans-serif;color:var(--navy);letter-spacing:.1em}
.tr-small{width:48px;height:13px;border:0;border-radius:99px;background:linear-gradient(#9a9a9e,#7c7c82);box-shadow:0 0 0 3px rgba(0,0,0,.08),0 2px 0 #5d5d63}
.tr-small:active{transform:translateY(2px);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
.tr-speaker{position:absolute;right:20px;bottom:18px;display:flex;gap:7px;transform:rotate(-28deg);pointer-events:none}
.tr-speaker i{width:5px;height:42px;border-radius:3px;background:var(--shell-d);box-shadow:inset 1px 1px 2px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.5)}
.tr-wrap.pad-off .tr-speaker{display:none}
@media (hover:none),(max-width:760px){ .tr-keys{display:none} }
.tr-pad button,.tr-small{-webkit-appearance:none;appearance:none;-webkit-touch-callout:none}
.tr-console{-webkit-touch-callout:none}
/* Phones: playing the game hides the app's top bar so the whole handheld fits on one screen */
@media (max-width:760px){
  body:has(.tr-wrap) header.top{display:none}
  body:has(.tr-wrap) #main{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
  body:has(.tr-wrap) #main{display:flex;flex-direction:column}
  body:has(.tr-wrap) .study-top{order:2;align-self:center;width:min(100%,calc((100vh - 76px) / 1.52));width:min(100%,calc((100dvh - 76px) / 1.52));margin:10px 0 0;flex-wrap:nowrap;gap:6px}
  body:has(.tr-wrap) .study-top .prompt-label{display:none}
  body:has(.tr-wrap) .study-top .btn{padding:6px 10px}
  .tr-wrap{gap:8px}
  .tr-console{width:min(100%,calc((100vh - 76px) / 1.52));width:min(100%,calc((100dvh - 76px) / 1.52))}
}
@media (max-width:400px){ .tr-console{padding:12px 12px 18px} .tr-dpad{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px)} .tr-ab button{width:46px;height:46px} .tr-ab{gap:12px} .tr-speaker i{height:34px} }
.tr-screen-wrap{position:relative}
.tr-box{position:absolute;left:6px;right:6px;bottom:6px;max-height:calc(100% - 12px);overflow-y:auto;background:var(--g0);color:var(--g3);border:3px solid var(--g3);border-radius:6px;padding:10px 12px;font:600 15px/1.4 ui-monospace,Consolas,monospace;box-shadow:0 0 0 3px var(--g0);display:none}
.tr-box.open{display:block}
.tr-box.big{top:6px;bottom:6px}
.tr-badges{display:inline-flex;gap:2px;vertical-align:middle}.tr-badge-img{image-rendering:pixelated;vertical-align:middle}
.tr-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tr-slot{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.tr-slot.cur{border-color:var(--accent)}
.tr-slot-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tr-box b{color:var(--g3)}
.tr-idle{display:flex;flex-direction:column;gap:4px}.tr-idle span{font-size:12px;opacity:.8}
.tr-text{padding-right:26px}
.tr-next{position:absolute;right:8px;bottom:6px;border:0;background:none;color:var(--g3);font-size:16px;cursor:pointer;animation:trBlink 1s steps(2) infinite}
@keyframes trBlink{50%{opacity:0}}
.tr-mtitle{font-size:13px;margin-bottom:6px}
.tr-menu{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tr-menu.long{grid-template-columns:1fr;max-height:240px;overflow-y:auto}
.tr-mi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--g2);background:var(--g0);color:var(--g3);border-radius:6px;padding:7px 9px;font:inherit;font-size:14px;cursor:pointer}
.tr-mi small{font-size:11px;font-weight:500;opacity:.85}
.tr-mi.sel{border-color:var(--g3);background:var(--g1);box-shadow:inset 4px 0 0 var(--g3)}
.tr-mi:disabled{opacity:.45;cursor:default}
.tr-mi .tr-mon-img{vertical-align:middle;image-rendering:pixelated}
.tr-back{margin-top:8px;border:0;background:none;color:var(--g3);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.tr-q{display:flex;flex-direction:column;gap:8px}
.tr-prompt{display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:800;text-align:center;padding:4px;background:var(--g1);border-radius:4px}
.tr-prompt .icon-btn{color:var(--g3)}
.tr-timer{height:4px;background:var(--g1);border-radius:2px;overflow:hidden}
.tr-timer{height:6px}
.tr-timer>div{height:100%;background:var(--g3);animation:trTime linear forwards}
@keyframes trTime{from{width:100%}75%{opacity:1}to{width:0;opacity:.55}}
.tr-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tr-opt{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--g2);background:var(--g0);color:var(--g3);border-radius:6px;padding:8px;font:inherit;font-size:14px;cursor:pointer;overflow-wrap:anywhere}
.tr-opt kbd{margin:0;background:var(--g1);color:var(--g3);border-color:var(--g2)}
.tr-opt:hover:not(:disabled){background:var(--g1)}
.tr-opt.right{background:var(--g2);color:var(--g0);border-color:var(--g3)}
.tr-opt.wrong{background:var(--g3);color:var(--g0)}
.tr-opt.dim{opacity:.5}
.tr-verdict{font-size:14px}
.tr-starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:8px}
.tr-starter{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px;border:2px solid var(--border);border-radius:14px;cursor:pointer;background:var(--surface)}
.tr-starter input{display:none}
.tr-starter:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tr-starter .tr-mon-img,.tr-mon-img{image-rendering:pixelated;background:var(--g0,#e0ecc0);border-radius:8px}
.tr-ml{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.tr-swatch{display:inline-flex;vertical-align:middle;border:1px solid currentColor;border-radius:3px;overflow:hidden;margin:0 2px}.tr-swatch i{width:10px;height:12px;display:block}
/* ---------- Home: "continue" card and deck list (all sizes) ---------- */
.feat-deck{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface));border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin:18px 0 22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.feat-deck h2 a{color:var(--text);cursor:pointer}
.fd-bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.fd-bar>div{height:100%;background:var(--good);border-radius:99px;min-width:4px}
.fd-go{width:100%;justify-content:center;padding:13px;font-size:16px;font-weight:700;border-radius:12px}
.seg-mini{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg-mini button{border:0;background:none;padding:7px 11px;cursor:pointer;color:var(--muted);font:inherit;font-size:13px}
.seg-mini button.on{background:var(--surface2);color:var(--text);font-weight:600}
.deck-list .deck-grid{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.deck-list .folder{margin-top:10px;padding:0}
.deck-list .folder-head{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;min-height:58px;box-shadow:var(--shadow)}
.deck-list .folder-icon{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--fc,var(--muted)) 22%,var(--surface));font-size:20px;flex:none}
.deck-list .folder-name{font-size:17px;cursor:pointer}
.deck-list .folder .deck-grid,.deck-list .folder .folder-empty{margin-left:20px;padding-left:16px;border-left:0}
/* a folder's whole title box takes a soft tint of the folder's color */
/* a folder's label shows its color at full strength (light and dark), with black or white text to suit it */
.folder.colored .folder-head,.deck-list .folder.colored .folder-head{background:var(--fc);border:1px solid color-mix(in srgb,var(--fc) 80%,#000);color:var(--fc-ink)}
.folder.colored .folder-head .muted,.folder.colored .folder-head .folder-toggle,.folder.colored .folder-head .icon-btn{color:var(--fc-ink);opacity:.85}
.deck-list .folder.colored .folder-icon,.folder.colored .folder-icon{background:color-mix(in srgb,var(--fc-ink) 22%,transparent)}
.folder.colored .folder-head.drop-on{outline:3px solid color-mix(in srgb,var(--fc) 70%,transparent)}
/* dark mode: bold, solid folder colors (text color picked so it stays readable) */
:root[data-theme=dark] .folder.colored .folder-head,:root[data-theme=dark] .deck-list .folder.colored .folder-head{background:var(--fc);border-color:color-mix(in srgb,var(--fc) 80%,#000);color:var(--fc-ink)}
:root[data-theme=dark] .folder.colored .folder-head .muted,:root[data-theme=dark] .folder.colored .folder-head .folder-toggle,:root[data-theme=dark] .folder.colored .folder-head .icon-btn{color:var(--fc-ink);opacity:.85}
:root[data-theme=dark] .deck-list .folder.colored .folder-icon,:root[data-theme=dark] .folder.colored .folder-icon{background:color-mix(in srgb,var(--fc-ink) 22%,transparent)}
.deck-list .folder.loose .deck-grid{margin-left:0;padding-left:0;border-left:0}
.folder-head[data-act=openFolder]{cursor:pointer}
.folder-head[data-act=openFolder]:hover{filter:brightness(.97)}
:root[data-theme=dark] .folder-head[data-act=openFolder]:hover{filter:brightness(1.1)}
.folder-view .fv-top{margin-bottom:12px}
.folder-view .folder{margin-top:0}
.folder-view .deck-list .folder .deck-grid{margin-left:0;padding-left:0}
/* ---------- Scan text from a photo ---------- */
dialog.scan-sheet{border:0;padding:0;background:transparent;width:min(760px,100vw);max-width:100vw;max-height:100dvh;margin:auto}
dialog.scan-sheet::backdrop{background:rgba(0,0,0,.55)}
.scan-panel{background:var(--surface);color:var(--text);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:calc(100dvh - 24px);overflow:hidden}

:where(p,li,td,th,h1,h2,h3,h4,blockquote,.word,.rich,.notes,.muted,.small,.cm-t):not(:is(button,a,[data-act],label,summary) *):not(button,a,[data-act],label,summary){cursor:var(--ibeam)}

<script>
/* In the Android app the web view has no speech voices of its own: speak through the phone's text-to-speech instead */
if (window.AndroidTTS && !('speechSynthesis' in window)) {
  window.SpeechSynthesisUtterance = function (text) { this.text = text; this.lang = ''; this.rate = 1; this.voice = null; };
  window.speechSynthesis = { speaking: false, addEventListener() {}, removeEventListener() {},
    getVoices() { let v = []; try { v = JSON.parse(AndroidTTS.voices()); } catch {}
      return v.length ? v : ['es-ES', 'es-MX', 'en-US', 'en-GB', 'fr-FR', 'de-DE', 'it-IT', 'pt-BR', 'pt-PT', 'ja-JP', 'ko-KR', 'zh-CN', 'ru-RU', 'nl-NL', 'pl-PL', 'tr-TR', 'ar-SA', 'hi-IN']
        .map(l => ({ name: `Phone voice (${l})`, lang: l, voiceURI: 'android:' + l, localService: true })); },
    speak(u) { AndroidTTS.speak(String(u.text || ''), (u.voice && u.voice.lang) || u.lang || '', +u.rate || 1); },
    cancel() { AndroidTTS.stop(); }, pause() {}, resume() {} };
}
</script>
<script>
'use strict';
/* ================= Utilities ================= */
const $ = s => document.querySelector(s);
const MIN = 60000, DAY = 86400000, LEARN_AHEAD = 20 * MIN;
const LS_KEY = 'studycards.v1';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dateKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

const ICON = {
  speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
};

const LANGS = [
  ['en-US','English (US)'],['en-GB','English (UK)'],['en-AU','English (Australia)'],['en-IN','English (India)'],
  ['es-ES','Spanish (Spain)'],['es-MX','Spanish (Mexico)'],['fr-FR','French (France)'],['fr-CA','French (Canada)'],
  ['de-DE','German'],['it-IT','Italian'],['pt-BR','Portuguese (Brazil)'],['pt-PT','Portuguese (Portugal)'],
  ['nl-NL','Dutch'],['sv-SE','Swedish'],['nb-NO','Norwegian'],['da-DK','Danish'],['fi-FI','Finnish'],
  ['pl-PL','Polish'],['cs-CZ','Czech'],['sk-SK','Slovak'],['hu-HU','Hungarian'],['ro-RO','Romanian'],['bg-BG','Bulgarian'],
  ['hr-HR','Croatian'],['el-GR','Greek'],['tr-TR','Turkish'],['ru-RU','Russian'],['uk-UA','Ukrainian'],
  ['ar-SA','Arabic'],['he-IL','Hebrew'],['fa-IR','Persian'],['hi-IN','Hindi'],['bn-IN','Bengali'],['ta-IN','Tamil'],
  ['th-TH','Thai'],['vi-VN','Vietnamese'],['id-ID','Indonesian'],['ms-MY','Malay'],['fil-PH','Filipino'],
  ['ja-JP','Japanese'],['ko-KR','Korean'],['zh-CN','Chinese (Mandarin, Simplified)'],['zh-TW','Chinese (Mandarin, Taiwan)'],['zh-HK','Chinese (Cantonese)'],
  ['sw-KE','Swahili'],['af-ZA','Afrikaans'],
];
function langName(code) {
  if (!code) return 'No speech';
  const f = LANGS.find(l => l[0] === code); if (f) return f[1];
  try { return new Intl.DisplayNames(['en'], { type: 'language' }).of(code) || code; } catch { return code; }
}
function langOptions(selected) {
  const known = new Set(LANGS.map(l => l[0]));
  const extra = [...new Set(voices.map(v => normLang(v.lang)))].filter(l => l && !known.has(l)).sort();
  let html = `<option value=""${!selected ? ' selected' : ''}>No speech</option><optgroup label="Languages">`;
  html += LANGS.map(([c, n]) => `<option value="${c}"${c === selected ? ' selected' : ''}>${esc(n)}</option>`).join('');
  html += '</optgroup>';
  if (extra.length) html += `<optgroup label="Other voices on this PC">${extra.map(c => `<option value="${c}"${c === selected ? ' selected' : ''}>${esc(langName(c))} (${c})</option>`).join('')}</optgroup>`;
  if (selected && !known.has(selected) && !extra.includes(selected)) html += `<option value="${esc(selected)}" selected>${esc(selected)}</option>`;
  return html;
}

/* ================= State ================= */
function defaultSettings() {
  return { rate: 0.9, autoplay: true, theme: 'system', voices: {}, ignoreAccents: true, learnSteps: [1, 10] };
}
function newCard(deckId, front, back, notes = '', example = '', exampleTr = '') {
  return { id: uid(), deckId, front, back, notes, example, exampleTr, created: Date.now(), state: 'new', due: 0, interval: 0, ease: 2.5, reps: 0, lapses: 0, step: 0 };
}
const SAMPLE_NAME = 'Spanish basics (sample)';
const SAMPLE_EX = {
  'hola': ['¡Hola! ¿Cómo estás?', 'Hello! How are you?'],
  'gracias': ['Muchas gracias por tu ayuda.', 'Thank you very much for your help.'],
  'por favor': ['Un café, por favor.', 'A coffee, please.'],
  'buenos días': ['Buenos días, señora.', 'Good morning, ma’am.'],
  'el perro': ['El perro come mucho.', 'The dog eats a lot.'],
  'el gato': ['El gato duerme en la cama.', 'The cat sleeps on the bed.'],
  'la casa': ['Mi casa es pequeña.', 'My house is small.'],
  'el agua': ['Quiero un vaso de agua.', 'I want a glass of water.'],
  'comer': ['Yo como pan todos los días.', 'I eat bread every day.'],
  'beber': ['Me gusta beber té.', 'I like to drink tea.'],
  'hablar': ['¿Hablas inglés?', 'Do you speak English?'],
};
function seed(s) {
  const d = { id: uid(), name: SAMPLE_NAME, frontLang: 'es-ES', backLang: 'en-US', newPerDay: 20, direction: 'front', created: Date.now() };
  s.decks.push(d);
  [['hola','hello'],['gracias','thank you'],['por favor','please'],['buenos días','good morning'],['el perro','the dog'],
   ['el gato','the cat'],['la casa','the house'],['el agua','the water','Feminine noun, but uses "el": el agua fría'],
   ['comer','to eat'],['beber','to drink'],['hablar','to speak'],['¿Dónde está el baño?','Where is the bathroom?']]
   .forEach(([f, b, n]) => s.cards.push(newCard(d.id, f, b, n || '', ...(SAMPLE_EX[f] || ['', '']))));
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const s = JSON.parse(raw); return migrate(s); }
  } catch (e) { console.error(e); }
  const s = { version: 1, decks: [], cards: [], settings: defaultSettings(), log: {}, lastBackup: null };
  seed(s);
  return s;
}
function migrate(s) {
  s.decks ||= []; s.cards ||= []; s.log ||= {};
  s.settings = { ...defaultSettings(), ...(s.settings || {}) };

/* ================= Spaced repetition (SM-2 style, like Anki) ================= */
function setReview(c, days, now, noFuzz) {

function schedule(card, r, now = Date.now(), noFuzz = false) {

  if (c.state === 'new' || c.state === 'learning' || c.state === 'relearning') {
    const relearn = c.state === 'relearning';
    const steps = relearn ? [10] : (S.settings.learnSteps.length ? S.settings.learnSteps : [1, 10]);
    if (c.state === 'new') { c.state = 'learning'; c.step = 0; }
    if (r === 1) { c.step = 0; c.due = now + steps[0] * MIN; }
    else if (r === 2) {
      const cur = steps[c.step] ?? steps[0], nxt = steps[c.step + 1];
      c.due = now + (nxt ? (cur + nxt) / 2 : cur * 1.5) * MIN;
    }
    else if (r === 3) {
      c.step++;
      if (c.step >= steps.length) setReview(c, relearn ? Math.max(1, c.interval) : 1, now, noFuzz);
      else c.due = now + steps[c.step] * MIN;

    else setReview(c, relearn ? Math.max(2, c.interval * 1.5) : 4, now, noFuzz);

      c.interval = Math.max(1, Math.round(c.interval * 0.5));

    else if (r === 3) { setReview(c, Math.max(c.interval + 1, (c.interval + overdue / 2) * c.ease), now, noFuzz); }
    else { c.ease += 0.15; setReview(c, Math.max(c.interval + 2, (c.interval + overdue) * c.ease * 1.3), now, noFuzz); }

function voiceScore(v, lang) {

}

  const list = voicesFor(lang);

  return list.find(v => v.voiceURI === game) || list.find(v => v.voiceURI === own) || list.find(v => v.voiceURI === saved) || list[0] || null;
}

/* ================= Study session ================= */
let study = null;
function pickNext() {

  const isLearn = c => c.state === 'learning' || c.state === 'relearning';
  const learnNow = cs.filter(c => isLearn(c) && c.due <= now).sort(byDue);
  const reviews = cs.filter(c => c.state === 'review' && c.due <= now).sort(byDue);
  const news = newRemaining(deck) > 0 ? cs.filter(c => c.state === 'new').sort((a, b) => a.created - b.created) : [];
  const ahead = cs.filter(c => isLearn(c) && c.due > now && c.due <= now + LEARN_AHEAD).sort(byDue);
  let order;
  if (reviews.length && news.length) order = study.done % 4 === 3 ? [...learnNow, news[0], ...reviews] : [...learnNow, reviews[0], news[0]];
  else order = [...learnNow, ...reviews, ...news];
  order.push(...ahead);
  order = order.filter(Boolean);
  return order.find(c => c.id !== study.lastId) || order[0] || null;
}
function startStudy(deckId) {

}
function studySides() {
  const d = deckById(study.deckId), c = study.card, rev = d.direction === 'back', tag = side => typeof posTag === 'function' ? posTag(c, side, d) : '';
  const fh = sideHtml(c, 'front', d) + tag('front'), bh = sideHtml(c, 'back', d) + tag('back');
  return rev ? { q: c.back, a: c.front, qh: bh, ah: fh, ql: d.backLang, al: d.frontLang } : { q: c.front, a: c.back, qh: fh, ah: bh, ql: d.frontLang, al: d.backLang };
}
function speakStudy(force) {
  if (!study?.card || (!autoplayOn() && !force)) return;
  const s = studySides();
  study.revealed ? speak(s.a, s.al) : speak(s.q, s.ql);
}
function reveal() { if (!study?.card || study.revealed) return; study.revealed = true; render(); speakStudy(); }
function rate(r) {
  if (!study?.card || !study.revealed) return;
  const idx = S.cards.findIndex(c => c.id === study.card.id); if (idx < 0) return;
  const prev = S.cards[idx], log = todayLog();
  study.undo = { prev: { ...prev }, wasNew: prev.state === 'new' };
  if (prev.state === 'new') log.intro[study.deckId] = (log.intro[study.deckId] || 0) + 1;
  log.reviews++; if (typeof subjCountReview === 'function') subjCountReview(study.deckId);
  if (typeof addPoints === 'function') { if (prev.state === 'new') rw().stats.learned = (rw().stats.learned || 0) + 1; addPoints(prev.state === 'new' ? 2 : 1); }
  S.cards[idx] = schedule(prev, r);
  save();
  study.done++; study.lastId = prev.id; study.revealed = false;
  if (study.done % 10 === 0 && typeof friendToast === 'function') friendToast('owl', 'cheer', { n: study.done });
  study.card = pickNext();
  render(); speakStudy();
}
function undo() {
  if (!study?.undo) return;
  const { prev, wasNew } = study.undo, log = todayLog();
  const idx = S.cards.findIndex(c => c.id === prev.id); if (idx < 0) return;
  S.cards[idx] = prev;
  if (wasNew) log.intro[study.deckId] = Math.max(0, (log.intro[study.deckId] || 1) - 1);
  log.reviews = Math.max(0, log.reviews - 1);
  if (typeof addPoints === 'function') { addPoints(-(wasNew ? 2 : 1), true); if (wasNew) rw().stats.learned = Math.max(0, (rw().stats.learned || 1) - 1); }
  save();
  study.card = prev; study.revealed = false; study.done = Math.max(0, study.done - 1); study.undo = null;
  render(); toast('Undone');
}

/* ================= Quiz ================= */
let quiz = null;
const QUIZ_DEFAULTS = { mode: 'mc', dir: 'fb', count: '10', pool: 'all', pics: 'show', limit: 'off', reveal: 'now' };
// reveal: 'now' = right or wrong after each question; 'end' = like a test, every answer is shown on the results screen
const quizAtEnd = () => quiz?.prefs?.reveal === 'end';
let quizPrefs = { ...QUIZ_DEFAULTS };
function norm(s) {
  s = String(s || '').toLowerCase().normalize('NFKC');
  if (S.settings.ignoreAccents) s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  return s.replace(/[¿?¡!.,;:"'“”‘’«»()[\]…\-–—]/g, ' ').replace(/\s+/g, ' ').trim();
}
function variants(ans) {
  const set = new Set(); const add = x => { const n = norm(x); if (n) set.add(n); };
  const noParen = x => x.replace(/\([^)]*\)/g, ' ');
  add(ans); add(noParen(ans));
  for (const p of ans.split(/[\/;,]/)) { add(p); add(noParen(p)); }
  return [...set];
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function checkTyped(input, ans) {
  const n = norm(input); if (!n) return { ok: false };
  const vs = variants(ans);
  if (vs.includes(n)) return { ok: true };
  for (const v of vs) {
    const d = lev(n, v);
    if ((v.length >= 5 && d <= 1) || (v.length >= 10 && d <= 2)) return { ok: true, typo: true };
  }

}
function makeOptions(correct, all) {
  const seen = new Set([norm(correct)]); const others = [];
  for (const t of shuffle(all)) { const n = norm(t); if (n && !seen.has(n)) { seen.add(n); others.push(t); } if (others.length >= 3) break; }
  return shuffle([correct, ...others]);
}
/* 🔒 Locked words: words you struggled with stay in every quiz on this deck until you unlock them (deck setting d.quizLock = card ids) */
const quizLocked = d => { const ids = new Set(cardsOf(d.id).map(c => c.id)); return (d.quizLock || []).filter(id => ids.has(id)); };

  return `<div class="quiz-lock"><b>🔒 Locked words</b> <span class="muted small">${lock.length} word${lock.length === 1 ? '' : 's'}: ${sample}${lock.length > 6 ? ' and more' : ''}</span>

      <button type="button" class="btn sm ghost" data-act="quizUnlockAll" data-id="${d.id}">🔓 Unlock all</button></div>`;
}
function quizLockResultsHtml(d, missed) {

function buildQuiz(deckId, prefs, onlyCards) {
  const d = deckById(deckId), all = cardsOf(deckId);

    const hard = pool.filter(c => c.lapses > 0 || c.ease < 2.4 || (c.state !== 'new' && c.state !== 'review'));
    if (hard.length >= 2) pool = hard.sort((a, b) => b.lapses - a.lapses || a.ease - b.ease);

  }
  if (!onlyCards && prefs.pool === 'learned') {

const CL_CHUNK = 60;
const clMoreHtml = st => st.n < st.cs.length ? `<div class="cl-more" id="clMore"><button type="button" class="btn" data-act="clMore">Show more cards (${st.cs.length - st.n} left)</button></div>` : '';

        <button type="button" class="icon-btn speak" data-act="testVoice" data-lang="${esc(l)}" title="Test">${ICON.speak}</button></div></div>`;
  }).join('');
  const lastB = S.lastBackup ? new Date(S.lastBackup).toLocaleDateString(undefined, { dateStyle: 'medium' }) : 'never';
  return `
    <div class="row-between" style="margin-bottom:16px"><h2 style="margin:0">Settings</h2>${typeof tourStart === 'function' ? '<button type="button" class="btn" data-act="tourStart" title="A one-minute guided tour of the app">🎓 Take the tour</button>' : ''}</div>
    ${typeof friendTip === 'function' ? friendTip('penguin', 'settings') : ''}
    <div class="stack">
    <section class="panel">
      <h3>Speech</h3>
      <div class="set-row"><div><b>Read cards aloud automatically</b><div class="muted small">Speak each side when it appears</div></div>
        <div class="ctl"><input type="checkbox" id="setAutoplay" ${st.autoplay ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--accent)"></div></div>
      <div class="set-row"><div><b>Speaking speed</b><div class="muted small" id="rateLbl">${st.rate.toFixed(2)}×</div></div>
        <div class="ctl"><input type="range" id="setRate" min="0.5" max="1.5" step="0.05" value="${st.rate}"></div></div>
      ${voiceRows || '<div class="set-row muted">Create a deck to choose voices for its languages.</div>'}
      <p class="muted small" style="margin:12px 0 0">These are the app-wide defaults. Each deck can turn speech off or use its own voice, speed and auto-play (deck <b>Settings</b>).</p>
      <p class="muted small" style="margin:12px 0 0">
        ${voices.some(v => /online|natural/i.test(v.name)) ? '✓ Natural online voices are available. They need an internet connection.' :
          'Tip: open this app with the <b>Estudiamos</b> desktop shortcut so it runs in Microsoft Edge, which has natural voices for many languages.'}
        To get voices that work offline, open Windows <b>Settings → Time &amp; language → Speech → Add voices</b>, then restart the app.</p>
    </section>
    <section class="panel">
      <h3>Study &amp; quizzes</h3>
      <div class="set-row"><div><b>Keep my streak when 🔥</b><div class="muted small">Any study keeps it going: one card in Study, a quick review, a quiz or a game. Or make it harder: only days you reach your daily goal.</div></div>
        <div class="ctl"><select class="inp" id="setStreakRule" style="margin:0;min-width:140px">
          <option value="any" ${st.streakRule !== 'goal' ? 'selected' : ''}>I study anything</option><option value="goal" ${st.streakRule === 'goal' ? 'selected' : ''}>I reach my daily goal</option></select></div></div>
      <div class="set-row"><div><b>Streak warning ⏳</b><div class="muted small">If you haven’t kept your streak yet, show a countdown to midnight from this time</div></div>
        <div class="ctl"><select class="inp" id="setStreakWarn" style="margin:0;min-width:140px">
          ${[[16, '4 pm'], [18, '6 pm'], [20, '8 pm'], [21, '9 pm'], [22, '10 pm'], [0, 'Off']].map(([v, l]) => `<option value="${v}" ${(st.streakWarnAt ?? 18) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
      <div class="set-row"><div><b>Daily goal 🎯</b><div class="muted small">Cards to study or answer each day (Study, Quick review, quizzes and games). Reaching it earns a points bonus.</div></div>
        <div class="ctl"><select class="inp" id="setGoal" style="margin:0;min-width:140px">
          ${[5, 10, 20, 30, 50, 100].map(n => `<option value="${n}" ${(st.dailyGoal || 10) === n ? 'selected' : ''}>${n} cards</option>`).join('')}</select></div></div>
      <div class="set-row"><div><b>Next question countdown</b><div class="muted small">In quizzes, after you answer, move on to the next question by itself</div></div>
        <div class="ctl"><select class="inp" id="setAutoNext" style="margin:0;min-width:140px">
          ${[[0, 'Off'], [2, '2 seconds'], [3, '3 seconds'], [5, '5 seconds'], [8, '8 seconds'], [10, '10 seconds'], [15, '15 seconds']].map(([v, l]) => `<option value="${v}" ${(+st.quizAutoNext || 0) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
      <div class="set-row"><div><b>Ignore accents when typing answers</b><div class="muted small">“cafe” counts as “café”</div></div>
        <div class="ctl"><input type="checkbox" id="setAccents" ${st.ignoreAccents ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--accent)"></div></div>
      <div class="set-row"><div><b>Learning steps (minutes)</b><div class="muted small">How soon new cards come back before graduating. Default: 1 10</div></div>
        <div class="ctl"><input class="inp" id="setSteps" value="${st.learnSteps.join(' ')}" style="width:140px;margin:0"></div></div>
      <div class="set-row"><div><b>Appearance</b></div>
        <div class="ctl"><select class="inp" id="setTheme" style="margin:0;min-width:160px">
          ${[['system', 'Match Windows'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<option value="${v}" ${st.theme === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
      <div class="set-row"><div><b>Background theme</b><div class="muted small">Landscape behind the app. Each profile has its own; choose it in your profile.</div></div>
        <div class="ctl"><button type="button" class="btn" data-act="editProfile">Choose background…</button></div></div>
      <div class="set-row"><div><b>Animal friends 🦉🐒🦒🐰🐿️🐢🐧</b><div class="muted small">Friends around the app who cheer you on</div></div>
        <div class="ctl"><input type="checkbox" id="setFriends" ${st.friends !== false ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--accent)"></div></div>
      <div class="set-row"><div><b>Animal sounds 🐘</b><div class="muted small">The elephant and friends make their sounds when you click them</div></div>
        <div class="ctl"><input type="checkbox" id="setMascotSound" ${st.mascotSound !== false ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--accent)"></div></div>
    </section>
    ${typeof syncSettingsHtml === 'function' ? syncSettingsHtml() : ''}
    ${typeof updSettingsHtml === 'function' ? updSettingsHtml() : ''}
    <section class="panel">
      <h3>Your data</h3>
      <div class="set-row"><div><b>Back up all decks</b><div class="muted small">Saves a file to Downloads. Last backup: ${lastB}</div></div>
        <div class="ctl"><button type="button" class="btn" data-act="backup">Save backup</button></div></div>
      <div class="set-row"><div><b>Export all decks</b><div class="muted small">As an Anki collection (.colpkg) or Anki deck package (.apkg). Noji can import .apkg files.</div></div>
        <div class="ctl"><button type="button" class="btn" data-act="exportDialog" ${S.cards.length ? '' : 'disabled'}>Export…</button></div></div>
      <div class="set-row"><div><b>Import a file</b><div class="muted small">Anki .apkg / .colpkg, Noji .ofc, CSV or text</div></div>
        <div class="ctl"><button type="button" class="btn" data-act="importFile">Import file…</button></div></div>
      <div class="set-row"><div><b>Restore from backup</b><div class="muted small">Replaces current data with a backup file</div></div>
        <div class="ctl"><button type="button" class="btn" data-act="restore">Open backup…</button></div></div>
      <div class="set-row"><div><b>Erase everything</b><div class="muted small">Deletes all decks, cards and progress</div></div>
        <div class="ctl"><button type="button" class="btn" style="color:var(--again)" data-act="eraseAll">Erase…</button></div></div>
    </section>
    ${typeof cmLinksHtml === 'function' ? cmLinksHtml() : ''}
    <p class="muted small" style="text-align:center;margin:4px 0 0">Estudiamos ${APP_VERSION} · Your cards stay on your own devices.</p>
    </div>`;
};

function render() {
  applyTheme();
  if (typeof applyScene === 'function') applyScene();
  document.body.classList.toggle('in-game', typeof PLAYING !== 'undefined' && PLAYING.includes(view.name));
  $('#main').innerHTML = views[view.name]();
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === view.name || (b.dataset.nav === 'home' && ['deck', 'quizSetup', 'quizResults', 'games', 'gameResults', 'quickStart', 'quickDone', 'runner', 'tower', 'towerSetup', 'showdown', 'showdownSetup', 'millionaire', 'priceSetup', 'priceParty', 'spinSetup', 'spinSpell', 'townSetup', 'wordTown', 'trailsTitle', 'trails', 'sagaTitle', 'saga'].includes(view.name))));
  if (typeof renderProfileBtn === 'function') renderProfileBtn();
  if (typeof renderStreakChip === 'function') renderStreakChip();
  if (typeof renderSyncChip === 'function') renderSyncChip();
  if (view.name === 'settings' && typeof syncFillPanel === 'function') syncFillPanel();
  if (view.name === 'settings' && typeof updFill === 'function') updFill();
  if (typeof renderTrophyChip === 'function') renderTrophyChip();
  if (typeof renderRail === 'function') renderRail();
  if (typeof renderSideFavs === 'function') renderSideFavs();
  { const np = $('#navPacks'); if (np && typeof packsReadyCount === 'function') { np.classList.toggle('dot', !!packsReadyCount()); if (['packOpen', 'gallery'].includes(view.name)) np.classList.add('on'); } }
  if (view.name === 'deck') {
    renderCardTable();
    if (typeof posMaybeFill === 'function') posMaybeFill(deckById(view.deckId));
  }
  if (view.name === 'quiz' && curQ()?.mode === 'type' && !curQ().result) setTimeout(() => $('#typeAns')?.focus(), 0);
  if (view.name === 'runner' && typeof initRunnerCanvas === 'function') initRunnerCanvas();
  if (view.name === 'builder' && typeof bldShowEnd === 'function') bldShowEnd();
  if (view.name === 'trails' && typeof trInit === 'function') trInit();
  if (view.name === 'saga' && typeof sgInit === 'function') sgInit();
  if (view.name === 'dictionary' && typeof renderDictList === 'function') renderDictList();
  if (view.name === 'priceParty' && typeof ppDrawBoard === 'function') setTimeout(() => ppDrawBoard(), 0);
  if (['priceSetup', 'spinSetup'].includes(view.name)) { const f = $('form'), upd = () => { const solo = f.players?.value === '1'; f.querySelector('.p2box')?.classList.toggle('dim', solo); }; f?.addEventListener('change', upd); upd(); }
}

/* ================= Events ================= */
const actions = {
  home: () => go({ name: 'home' }),
  settings: () => go({ name: 'settings' }),
  newDeck: () => deckDialog(null),
  clMore: () => clShowMore(),
  openDeck: el => go({ name: 'deck', deckId: el.dataset.id }),
  deckSettings: el => deckDialog(deckById(el.dataset.id)),
  importCards: el => importDialog(deckById(el.dataset.id)),
  exportDeck: el => exportDeckText(deckById(el.dataset.id)),
  impFile: () => pickFile('.txt,.csv,.tsv,text/plain,text/csv', text => { $('#impText').value = text; $('#dlg')._upd?.(); }),
  deleteDeck: el => {
    const d = deckById(el.dataset.id), n = cardsOf(d.id).length;
    confirmDlg('Delete deck?', `“${d.name}” and its ${n} card${n === 1 ? '' : 's'} will be deleted. This can’t be undone unless you have a backup.`, 'Delete deck', () => {
      S.cards = S.cards.filter(c => c.deckId !== d.id); S.decks = S.decks.filter(x => x.id !== d.id); save(); go({ name: 'home' }); toast('Deck deleted');
    });
  },
  addCard: () => addCard(),
  editCard: el => cardDialog(S.cards.find(c => c.id === el.dataset.id)),
  deleteCard: el => {
    const c = S.cards.find(x => x.id === el.dataset.id);
    confirmDlg('Delete card?', `“${c.front}” → “${c.back}”`, 'Delete', () => { S.cards = S.cards.filter(x => x.id !== c.id); save(); renderCardTable(); toast('Card deleted'); });
  },
  speak: el => speak(el.dataset.text, el.dataset.lang),
  speakField: el => {
    const f = document.getElementById(el.dataset.field);
    const t = (f ? (f.isContentEditable ? (f.querySelector('[data-focus]') && cfSpoken(cfNormMarks(cleanHtml(f.innerHTML), f.dataset.fmode))) || f.innerText : f.value) : '').trim();
    if (t) speak(t, el.dataset.lang); else toast('Type something first');
  },
  study: el => startStudy(el.dataset.id),
  reveal: () => reveal(),
  rate: el => rate(+el.dataset.r),
  undo: () => undo(),
  editCurrent: () => study?.card && cardDialog(study.card, c => { if (study.card?.id === c.id) study.card = c; render(); }),
  extraNew: () => { const l = todayLog(); l.extra[study.deckId] = (l.extra[study.deckId] || 0) + 10; save(); study.card = pickNext(); render(); speakStudy(); },
  quizSetup: el => go({ name: 'quizSetup', deckId: el.dataset.id }),
  pick: el => pickOption(+el.dataset.i),
  giveUp: () => answerQuiz(null, false),
  quizNext: () => quizNext(),
  quizStay: () => { if (quiz) { quiz.autoAt = 0; render(); } },
  quitQuiz: () => { const id = quiz.deckId; confirmDlg('Quit quiz?', 'Your progress in this quiz will be lost.', 'Quit', () => go({ name: 'deck', deckId: id })); },
  quizLockMissed: () => { const d = deckById(quiz.deckId), ids = quiz.questions.filter(q => q.result === 'bad').map(q => q.cardId), set = new Set(d.quizLock || []), before = set.size;
    ids.forEach(id => set.add(id)); d.quizLock = [...set]; save(); render(); toast(`🔒 ${set.size - before} word${set.size - before === 1 ? '' : 's'} locked. Your next quizzes on this deck will keep retesting them.`); },
  quizLockRetest: () => { const d = deckById(quiz.deckId), lock = quizLocked(d); if (lock.length < 1) return toast('No locked words'); startQuiz(d.id, { ...quiz.prefs, count: 'all' }, lock); if (quiz) quiz.locked = true; },
  quizUnlockRight: () => { const d = deckById(quiz.deckId), right = new Set(quiz.questions.filter(q => q.result === 'ok' || q.result === 'typo').map(q => q.cardId)), before = (d.quizLock || []).length;
    d.quizLock = (d.quizLock || []).filter(id => !right.has(id)); save(); render(); toast(`🔓 Unlocked ${before - d.quizLock.length} word${before - d.quizLock.length === 1 ? '' : 's'} you got right`); },
  quizUnlockAll: el => { const d = deckById(el?.dataset?.id || quiz?.deckId || view.deckId); if (!d) return; const was = d.quizLock || []; d.quizLock = []; save(); render();
    undoToast('🔓 Lock off: quizzes pick new words again', () => { d.quizLock = was; save(); render(); toast('Lock is back on'); }); },
  retryMissed: () => startQuiz(quiz.deckId, quiz.prefs, quiz.questions.filter(q => q.result === 'bad').map(q => q.cardId)),
  quizAgain: () => go({ name: 'quizSetup', deckId: quiz.deckId }),
  testVoice: el => {
    const samples = { en: 'Hello! This is how I sound.', es: '¡Hola! Así es como sueno.', fr: 'Bonjour ! Voici ma voix.', de: 'Hallo! So klinge ich.', it: 'Ciao! Questa è la mia voce.', pt: 'Olá! Esta é a minha voz.', ja: 'こんにちは。これが私の声です。', ko: '안녕하세요. 제 목소리입니다.', zh: '你好！这是我的声音。', ru: 'Привет! Вот так звучит мой голос.', nl: 'Hallo! Zo klink ik.', ar: 'مرحبا! هذا هو صوتي.', hi: 'नमस्ते! यह मेरी आवाज़ है।', tr: 'Merhaba! Sesim böyle.', pl: 'Cześć! Tak brzmi mój głos.' };
    const l = el.dataset.lang; speak(samples[l.split('-')[0]] || langName(l), l);
  },
  backup: () => exportBackup(),
  restore: () => pickFile('.json,application/json', restoreBackup),
  eraseAll: () => confirmDlg('Erase everything?', 'All decks, cards and progress will be permanently deleted. Consider saving a backup first.', 'Erase everything', () => {
    S = { version: 1, decks: [], cards: [], settings: S.settings, log: {}, lastBackup: null }; save(); clearAllMedia(); go({ name: 'home' }); toast('All data erased');
  }),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = actions[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'quizForm') {
    e.preventDefault(); const f = e.target;
    quizPrefs = { mode: f.mode.value, dir: f.dir.value, count: f.count.value, pool: f.pool.value, pics: f.pics?.value || quizPrefs.pics || 'show', limit: f.limit?.value || 'off', reveal: f.reveal?.value || 'now' };
    if (S.settings.quizReveal !== quizPrefs.reveal) { S.settings.quizReveal = quizPrefs.reveal; save(); }   // remembered next time
    const lock = f.useLock?.checked ? quizLocked(deckById(view.deckId)) : null;
    if (lock && lock.length) { startQuiz(view.deckId, quizPrefs, lock); if (quiz) quiz.locked = true; }
    else startQuiz(view.deckId, quizPrefs);
  }
  if (e.target.id === 'typeForm') {
    e.preventDefault(); const v = $('#typeAns').value;
    if (!v.trim()) { toast('Type an answer, or press “I don’t know”'); return; }
    const r = checkTyped(v, curQ().answer); answerQuiz(v, r.ok, r.typo);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'setAutoplay') { S.settings.autoplay = t.checked; save(); }
  else if (t.id === 'setAccents') { S.settings.ignoreAccents = t.checked; save(); }
  else if (t.id === 'setAutoNext') { S.settings.quizAutoNext = +t.value; save(); toast(+t.value ? `Quizzes move to the next question after ${t.value} seconds` : 'Next question countdown is off'); }
  else if (t.id === 'setFriends') { S.settings.friends = t.checked; save(); render(); }
  else if (t.id === 'setMascotSound') { S.settings.mascotSound = t.checked; save(); if (t.checked) trumpet(); }
  else if (t.id === 'setStreakWarn') { S.settings.streakWarnAt = +t.value; save(); streakWarnTick?.(); toast(+t.value ? `⏳ Streak warning from ${t.selectedOptions[0].text}` : 'Streak warning off'); }
  else if (t.id === 'setStreakRule') { S.settings.streakRule = t.value; save(); renderStreakChip?.(); toast(t.value === 'goal' ? '🔥 Your streak now needs your daily goal' : '🔥 Any study now keeps your streak'); }
  else if (t.id === 'setGoal') { S.settings.dailyGoal = +t.value; save(); renderStreakChip?.(); toast(`Daily goal: ${t.value} cards`); }
  else if (t.id === 'setTheme') { S.settings.theme = t.value; save(); applyTheme(); }
  else if (t.id === 'setSteps') {
    const steps = t.value.split(/[\s,]+/).map(Number).filter(n => n > 0 && n < 1440);
    S.settings.learnSteps = steps.length ? steps : [1, 10]; t.value = S.settings.learnSteps.join(' '); save(); toast('Learning steps saved');
  }
  else if (t.id === 'setRate') { S.settings.rate = +t.value; save(); speak('One, two, three.', 'en-US'); }
  else if (t.dataset.voiceLang) { S.settings.voices[t.dataset.voiceLang] = t.value; save(); speak(langName(t.dataset.voiceLang), t.dataset.voiceLang); }
});
document.addEventListener('input', e => { if (e.target.id === 'setRate') $('#rateLbl').textContent = (+e.target.value).toFixed(2) + '×'; });
document.addEventListener('keydown', e => {
  if ($('#dlg').open) {
    if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); $('#dlg form').requestSubmit(); }
    return;
  }
  const tag = e.target.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  const k = e.key.toLowerCase();
  if (view.name === 'study' && study) {
    if (e.ctrlKey && k === 'z') { e.preventDefault(); undo(); return; }
    if (typing || e.ctrlKey || e.altKey || !study.card) return;
    if (!study.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
    else if (study.revealed && ['1', '2', '3', '4'].includes(e.key)) rate(+e.key);
    else if (study.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); rate(3); }
    else if (k === 'r') speakStudy(true);
    else if (k === 'e') actions.editCurrent();
  } else if (view.name === 'quiz' && quiz) {
    const q = curQ(); if (!q || quiz.advancing) return;
    if (q.result && e.key === 'Enter') { e.preventDefault(); quizNext(); return; }
    if (typing || e.ctrlKey || e.altKey) return;
    if (!q.result && q.mode !== 'type' && /^[1-9]$/.test(e.key)) pickOption(+e.key - 1);
    else if (k === 'r') q.result && !quizAtEnd() ? speak(q.answer, q.answerLang) : speak(q.prompt, q.promptLang);
  } else if (view.name === 'deck' && e.ctrlKey && e.key === 'Enter' && e.target.closest('.add-card')) {
    e.preventDefault(); addCard();
  }
});
document.addEventListener('DOMContentLoaded', () => boot());
