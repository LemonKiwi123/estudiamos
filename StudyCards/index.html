<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<!-- never let the browser auto-translate: your cards and sentences must stay in the language you are learning -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudiamos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudiamos">
<meta name="theme-color" content="#3b54e8">
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --surface2:#efede7; --text:#1c1b19; --muted:#6c6963; --border:#e0ddd5;
  --accent:#3b54e8; --accent-soft:#e6e9fd; --accent-ink:#fff;
  --again:#cf3f3f; --hard:#c97c10; --good:#23905a; --easy:#2b74c9;
  --new:#2b74c9; --learn:#c97c10; --rev:#23905a;
  --ok-bg:#e3f4ea; --bad-bg:#fbe5e5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --radius:14px;
}
:root[data-theme=dark]{
  --bg:#131313; --surface:#1d1d1d; --surface2:#272727; --text:#ecebe7; --muted:#a3a09a; --border:#343434;
  --accent:#8090ff; --accent-soft:#272c4a; --accent-ink:#0d0d0d;
  --again:#f07272; --hard:#e9a64a; --good:#4cc589; --easy:#6aa8f0;
  --new:#6aa8f0; --learn:#e9a64a; --rev:#4cc589;
  --ok-bg:#17301f; --bad-bg:#3a1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
/* ---------- Professional look (profile menu → Switch to the Professional look) ---------- */
body.look-pro{--radius:8px;letter-spacing:.003em}
:root:not([style*="--accent:"]) body.look-pro{--accent:#2f4f86;--accent-soft:#e7ecf5;--accent-ink:#fff}
:root[data-theme=dark]:not([style*="--accent:"]) body.look-pro{--accent:#8ea8d8;--accent-soft:#1f2838;--accent-ink:#0d1117}
:root:not([style*="--bg:"]) body.look-pro{--bg:#f4f5f7}
:root[data-theme=dark]:not([style*="--bg:"]) body.look-pro{--bg:#121417}
body.look-pro{background:var(--bg)}
body.look-pro .panel,body.look-pro .stat,body.look-pro .deck{box-shadow:0 1px 2px rgba(0,0,0,.05)}
body.look-pro .btn,body.look-pro .btn.big,body.look-pro .btn.sm{border-radius:6px}
body.look-pro .icon-btn{border-radius:6px}
body.look-pro .pill,body.look-pro .pos-tag,body.look-pro .dup-tag{border-radius:4px}
body.look-pro h1,body.look-pro h2,body.look-pro h3{letter-spacing:-.01em}
body.look-pro .brand{font-weight:650;letter-spacing:.01em}
body.look-pro .flash{border-radius:10px}
body.look-pro .mascot-say.pro-note{display:block}
body.look-pro .mascot-say.pro-note .bubble{box-shadow:none;border-radius:6px;border-left:3px solid var(--accent);background:var(--surface2)}
body.look-pro .mascot-say.pro-note .bubble::before,body.look-pro .mascot-say.pro-note .bubble::after{display:none}
body.look-pro .friend-tip,body.look-pro #friendToast,body.look-pro .mascot{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:22px}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
kbd{font:12px "Segoe UI",sans-serif;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;margin-left:6px;color:var(--muted);background:var(--surface)}

header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
header .inner{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;cursor:pointer;user-select:none}
.brand .logo{width:38px;height:38px;display:grid;place-items:center;margin:-6px -2px -6px -6px}
.brand{font-size:19px;letter-spacing:-.01em}
.mascot{flex:none;overflow:visible;cursor:pointer;transform-origin:50% 90%}
.mascot.honk,.friend.honk{animation:honk .6s ease-out}
.friend{flex:none;overflow:visible;cursor:pointer;transform-origin:50% 90%}
.friend-tip{display:flex;align-items:center;gap:12px;margin:0 0 18px;max-width:640px}
.friend-tip .bubble,#friendToast .bubble{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);font-size:14px}
.friend-tip .bubble::before,#friendToast .bubble::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--border);border-bottom:1px solid var(--border);transform:translateY(-50%) rotate(45deg)}
.friend-tip .bubble b,#friendToast .bubble b{color:var(--accent);margin-right:2px}
.friend-tip.compact{margin:4px auto 0;justify-content:center;text-align:left}
#friendToast{position:fixed;left:18px;bottom:18px;z-index:55;display:flex;align-items:center;gap:10px;max-width:min(380px,calc(100vw - 36px));opacity:0;transform:translateY(16px);pointer-events:none;transition:.25s}
#friendToast.show{opacity:1;transform:none;pointer-events:auto}
@keyframes honk{0%{transform:rotate(0) scale(1)}20%{transform:rotate(-8deg) scale(1.08)}45%{transform:rotate(6deg) scale(1.05)}70%{transform:rotate(-3deg)}100%{transform:rotate(0) scale(1)}}
.mascot-say{display:flex;align-items:center;gap:14px;justify-content:center;text-align:left;max-width:560px;margin:0 auto}
.mascot-say .bubble{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 16px;color:var(--text);box-shadow:var(--shadow)}
.mascot-say .bubble::before{content:"";position:absolute;left:-8px;top:50%;width:14px;height:14px;background:var(--surface);border-left:1px solid var(--border);border-bottom:1px solid var(--border);transform:translateY(-50%) rotate(45deg)}
.mascot-bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:none;border:0;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
nav button:hover{background:var(--surface2);color:var(--text)}
nav button.on{background:var(--surface2);color:var(--text)}

main{max-width:920px;margin:0 auto;padding:22px 16px 80px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s,transform .05s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--again);border-color:var(--again);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.big{padding:13px 22px;font-size:16px;border-radius:12px}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.speak{color:var(--accent)}
.icon-btn.speak.lg{width:46px;height:46px;border-radius:12px;background:var(--accent-soft)}
.icon-btn.speak.lg svg{width:24px;height:24px}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:16px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.stats.six{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}

.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:14px}
.deck{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.deck h3 a{color:var(--text)}
.deck .langs{color:var(--muted);font-size:13px}
.counts{display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums;font-weight:600}
.counts .c-new{color:var(--new)}.counts .c-learn{color:var(--learn)}.counts .c-rev{color:var(--rev)}
.counts .lbl{font-weight:400;color:var(--muted);font-size:12px;margin-left:3px}
.deck-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
/* Profiles */
.avatar{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;overflow:hidden;flex:none;line-height:1;user-select:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-btn{border:0;background:none;padding:2px;border-radius:50%;cursor:pointer;margin-left:6px}
.avatar-btn:hover{box-shadow:0 0 0 3px var(--accent-soft)}
header .inner{position:relative}
.pmenu{position:absolute;right:16px;top:52px;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:8px;min-width:230px;display:flex;flex-direction:column}
.pmenu[hidden]{display:none}
nav button[hidden]{display:none!important}
.pmenu .pm-head{display:flex;gap:10px;align-items:center;padding:6px 8px 10px;border-bottom:1px solid var(--border);margin-bottom:6px}
.pmenu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer}
.pmenu button:hover{background:var(--surface2)}
.profiles-screen{text-align:center;padding:40px 0}
.profiles-screen h2{font-size:28px;margin-bottom:26px}
.profile-grid{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.profile-tile{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:12px;border-radius:16px;min-width:130px}
.profile-tile:hover{background:var(--surface)}
.profile-tile:hover .avatar{box-shadow:0 0 0 4px var(--accent)}
.profile-tile .pname{font-weight:600;font-size:16px}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;display:inline-block;border:2px solid transparent}
.swatch input{display:none}
.swatch:has(input:checked){box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
.cp{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);max-width:440px}
.cp-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.cp-swatch input[type=color]{width:56px;height:44px;padding:2px;border:2px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;display:block}
.cp-hex{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.cp-hexbox{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 8px;font-family:ui-monospace,Consolas,monospace;color:var(--muted)}
.cp-hexbox input{width:76px;border:0;background:none;padding:7px 2px;font:inherit;color:var(--text);text-transform:uppercase;outline:none}
.cp-hexbox:has(input.bad){border-color:var(--again)}
.cp-ch{display:grid;grid-template-columns:18px 1fr 64px;align-items:center;gap:10px}
.cp-l{font-weight:700;font-size:13px;color:var(--muted)}
.cp-ch input[type=range]{width:100%;height:14px;-webkit-appearance:none;appearance:none;border-radius:99px;background:var(--track,var(--border));border:1px solid var(--border);margin:0;cursor:pointer}
.cp-ch input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #333;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cp-ch input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #333}
.cp-ch input[type=number]{width:100%;padding:6px 6px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;text-align:center}
.cp.off .cp-ch,.cp.off .cp-hex{opacity:.6}
#scene.solid::after{background:color-mix(in srgb,var(--bg) 35%,transparent)}
.greet{display:flex;gap:12px;align-items:center;margin-bottom:16px}
/* Quick review & progress bars */
.seg-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2);width:100%}
.seg-bar>div{height:100%;transition:width .3s}
.seg-bar .g{background:var(--good)} .seg-bar .n{background:var(--hard)} .seg-bar .m{background:var(--accent)}
:root{--qr-got:#2f6fe0;--qr-nq:#f5c211;--qr-nq-text:#806000} :root[data-theme=dark]{--qr-nq-text:#ffd84d} .qr-nq-dot{color:var(--qr-nq)} .seg-bar.qr-seg .g{background:var(--qr-got)} .seg-bar.qr-seg .n{background:var(--qr-nq)} .qr-opts{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;max-width:520px}
.seg-bar.tall{height:16px}
.cl-head{display:flex;flex-direction:column;gap:12px}
.cl-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.cl-legend span{display:inline-flex;align-items:center;gap:6px}
.cl-legend i{width:16px;height:12px;border-radius:4px;background:var(--surface2);display:inline-block}
.cl-legend i.g{background:var(--good)} .cl-legend i.m{background:var(--accent)}
.cl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cl-tools .inp{flex:1;min-width:160px;margin:0}
.cl-opts{display:flex;flex-direction:column;gap:8px}
.cl-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px;border-radius:12px;border:2px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.cl-opt:hover{border-color:var(--accent)}
.cl-opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.cl-check{color:var(--accent);font-size:18px}
.cl-group{display:flex;flex-direction:column;gap:8px}
.cl-gname{font-size:13px;font-weight:600;color:var(--muted)}
.cl-exrow{display:flex;flex-direction:column;gap:4px}
.study-top .fanfare-pick{font-size:13px;padding:4px 6px;max-width:150px}
.pill.frozen{color:var(--easy)}
tr.frozen td.txt{opacity:.55}
.icon-btn.on{background:color-mix(in srgb,var(--easy) 20%,transparent)}
table.cards td.pv-open-cell{cursor:pointer}
table.cards tbody tr:hover td.pv-open-cell{background:color-mix(in srgb,var(--accent) 5%,transparent)}
body.pv-open{overflow:hidden}
#cardPreview{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.72);display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));animation:pvIn .15s ease-out}
@keyframes pvIn{from{opacity:0}to{opacity:1}}
.pv-top{display:flex;justify-content:center;width:100%}
.pv-count{background:var(--surface);color:var(--text);border-radius:99px;padding:6px 16px;font-size:15px}
.pv-row{flex:1;min-height:0;width:100%;max-width:760px;display:flex;align-items:center;gap:10px}
.pv-card{flex:1;height:100%;max-height:720px;overflow:auto;background:var(--surface);color:var(--text);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);
  padding:28px 24px;display:flex;flex-direction:column;gap:14px;text-align:center}
.pv-card.frozen{outline:3px solid color-mix(in srgb,var(--easy) 60%,transparent)}
.pv-card hr{border:0;border-top:1px solid var(--border);margin:4px 0;width:100%}
.pv-side{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:22px;line-height:1.35;overflow-wrap:anywhere}
.pv-side .rich img{max-height:200px;max-width:100%}
.pv-side .speak{border-radius:50%;background:var(--surface2)}
.pv-extra{font-size:15px;line-height:1.45}
.pv-status{margin-top:auto}
.pv-nav{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);color:var(--text);font-size:30px;line-height:1;cursor:pointer;box-shadow:var(--shadow)}
.pv-nav:disabled,.pv-round:disabled{opacity:.35;cursor:default}
.pv-bottom{display:flex;align-items:center;gap:12px;width:100%;max-width:760px}
.pv-mid{flex:1;display:flex;justify-content:center;gap:14px}
.pv-round{flex:none;width:54px;height:54px;border-radius:50%;border:0;background:var(--surface);color:var(--text);display:grid;place-items:center;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
.pv-round svg{width:22px;height:22px}
.pv-round.on{background:color-mix(in srgb,var(--easy) 30%,var(--surface))}
.pv-mnav{font-size:30px;display:none}
@media (max-width:760px){ .pv-nav{display:none} .pv-mnav{display:grid} .pv-card{padding:22px 16px} }
/* computer: the buttons sit right under the card instead of at the bottom of the screen */
@media (min-width:761px){ #cardPreview{justify-content:center} .pv-row{flex:0 1 auto} .pv-card{height:auto;min-height:min(460px,60vh);max-height:min(720px,calc(100vh - 150px))} .pv-bottom{max-width:640px} }
/* Progress page */
.activity{display:flex;align-items:flex-end;gap:3px;height:120px;margin:14px 0 6px}
.activity .day{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;background:var(--surface2);border-radius:4px;overflow:hidden}
.activity .r{background:var(--accent)} .activity .s{background:var(--good)} .activity .q{background:var(--hard)}
.trend-pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:640px){.trend-pair{grid-template-columns:1fr}}
.trend{display:flex;align-items:flex-end;gap:4px;height:90px;margin:12px 0 6px}
.trend .bar{flex:1;border-radius:4px 4px 0 0;min-width:6px}
.deck-progress .dp-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.deck-progress .dp-row:last-child{border-bottom:0}
.hist{display:flex;flex-direction:column;margin-top:10px}
.hist-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;cursor:pointer;border-radius:8px}
.hist-row:hover{background:var(--surface2)}
.hist-row:last-child{border-bottom:0}
.h-emoji{font-size:22px;width:28px;text-align:center}
.h-main{flex:1;min-width:0}
.h-score{display:flex;align-items:center;gap:8px;width:150px;justify-content:flex-end}
.pbar{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;max-width:90px}
.pbar span{display:block;height:100%;border-radius:99px}
/* Streak */
.streak-chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:4px 10px;font-weight:700;cursor:pointer;display:inline-flex;gap:4px;align-items:center;margin-left:8px;font-variant-numeric:tabular-nums}
.streak-chip:hover{border-color:var(--hard)}
.streak-chip[hidden],.avatar-btn[hidden]{display:none}
.streak-panel{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:18px}
.sp-main{display:flex;gap:14px;align-items:center;min-width:200px}
.sp-n{font-size:26px;font-weight:800}
.flame{font-size:46px;filter:grayscale(1);opacity:.55;transition:.3s}
.flame.lit{filter:none;opacity:1;animation:flicker 2.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
.sp-goal{display:flex;flex-direction:column;gap:8px}
.week{display:flex;gap:6px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px;background:var(--surface2);font-size:12px}
.wk .wd{color:var(--muted)} .wk .dot{font-size:16px;line-height:1.2}
.wk.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wk.met{background:color-mix(in srgb,var(--hard) 18%,var(--surface))}
.wk.frozen{background:color-mix(in srgb,var(--easy) 16%,var(--surface))}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:12px;background:var(--surface2);text-align:center;opacity:.6}
.badge.got{opacity:1;background:color-mix(in srgb,var(--hard) 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hard) 40%,transparent)}
.badge .be{font-size:30px}
.badge .pbar{flex:none;height:6px}
.badge-mini{font-size:28px}
.celebrate{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;position:relative;z-index:1}
.celebrate .big{font-size:72px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.reward{background:color-mix(in srgb,var(--easy) 14%,var(--surface));border-radius:12px;padding:10px 14px}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti span{position:absolute;top:-30px;font-size:20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
@media (max-width:640px){ .streak-panel{grid-template-columns:1fr} .deck-progress .dp-row{grid-template-columns:1fr;gap:6px} .h-score{width:auto} }
.qr-bar .btn{flex:1;max-width:260px}
/* Dictionary */
.dict-tools{display:flex;flex-direction:column;gap:10px}
.letter-index{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;position:sticky;top:58px;z-index:3;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);padding:6px;border-radius:12px}
.letter-index a{min-width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:13px;color:var(--text);text-decoration:none}
.letter-index a:hover{border-color:var(--accent);color:var(--accent)}
.dict{display:flex;flex-direction:column;gap:8px}
.dict-letter{font-size:22px;font-weight:800;color:var(--accent);margin:12px 0 2px;scroll-margin-top:110px}
.dict-entry{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .15s}
.dict-entry:hover{border-color:var(--accent)}
.de-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.de-word{font-size:19px;font-weight:700}
.de-meaning{font-size:15px}
.de-ex{font-size:14px;font-style:italic}
/* Word cards & packs */
nav button.dot{position:relative}
nav button.dot::after{content:"";position:absolute;top:5px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--again);box-shadow:0 0 0 2px var(--bg)}
.wcard{--rc:#9aa5b1;position:relative;width:170px;border-radius:14px;background:var(--surface);border:3px solid var(--rc);box-shadow:var(--shadow);padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;overflow:hidden;user-select:none}
.wcard.sm{width:128px;padding:6px 6px 8px;border-width:2.5px}
.wcard.lg{width:240px;padding:10px 10px 14px}
.wc-top{display:flex;justify-content:space-between;width:100%;font-size:11px;font-weight:700;color:var(--rc)}
.wc-art{width:100%;aspect-ratio:4/3;border-radius:10px;display:grid;place-items:center;font-size:62px;line-height:1}
.wcard.sm .wc-art{font-size:44px}.wcard.lg .wc-art{font-size:96px}
.wc-word{font-size:20px;font-weight:800;line-height:1.15;word-break:break-word;margin-top:4px}
.wcard.sm .wc-word{font-size:16px}.wcard.lg .wc-word{font-size:28px}
.wc-reading{font-size:12px;color:var(--muted)}
.wc-en{font-size:13px;color:var(--muted)}
.wc-foot{display:flex;justify-content:space-between;width:100%;font-size:12px;margin-top:auto}
.wc-stars{color:var(--rc);letter-spacing:1px}
.wc-copies{font-weight:700;color:var(--muted)}
.wc-new{position:absolute;top:30px;left:6px;transform:rotate(-8deg);background:var(--again);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.wcard.r-epic,.wcard.r-legendary{background:linear-gradient(160deg,var(--surface) 60%,color-mix(in srgb,var(--rc) 25%,var(--surface)))}
.wcard.r-legendary::before,.wcard.shiny::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.55) 35%,rgba(255,120,220,.25) 45%,rgba(120,200,255,.3) 55%,transparent 70%);background-size:250% 100%;animation:holo 3.2s linear infinite;pointer-events:none;mix-blend-mode:screen;z-index:1}
@keyframes holo{0%{background-position:150% 0}100%{background-position:-100% 0}}
.wcard.missing{border-style:dashed;border-color:var(--border);background:var(--surface2);opacity:.75}
.wcard.missing .wc-art{background:var(--bg)}
.wcard.back{border-color:#3b54e8;background:repeating-linear-gradient(45deg,#3b54e8 0 10px,#4a62f0 10px 20px)}
.wc-back-inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;min-height:220px;width:100%}
.wcard.sm .wc-back-inner{min-height:160px}
.pack-panel{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.pack-info{display:flex;flex-direction:column;gap:12px}
.pack-stage{position:relative;filter:grayscale(.55) opacity(.8);transition:.3s}
.pack-stage.ready{filter:none;cursor:pointer;animation:packbob 2.2s ease-in-out infinite}
.pack-stage.ready:hover{transform:scale(1.04) rotate(-2deg)}
@keyframes packbob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.pack{position:relative;width:190px;aspect-ratio:240/340;filter:drop-shadow(0 14px 22px rgba(59,84,232,.38));color:#fff}
.pack:not(.big){width:116px}
.pack-svg{display:block;width:100%;height:100%;overflow:visible}
.pack-svg .pk-holo{animation:pkholo 3.2s linear infinite}
@keyframes pkholo{0%{transform:translateX(0)}100%{transform:translateX(480px)}}
@media (prefers-reduced-motion:reduce){ .pack-svg .pk-holo{animation:none} }
.pack-lang{position:absolute;left:50%;top:72.5%;transform:translateX(-50%);white-space:nowrap;background:rgba(11,15,58,.45);border:1.5px solid rgba(255,255,255,.55);border-radius:99px;padding:2px 12px;font-weight:700;font-size:13px;letter-spacing:.02em;backdrop-filter:blur(2px)}
.pack:not(.big) .pack-lang{font-size:10px;padding:1px 8px}
.pack-count{position:absolute;top:-8px;right:-10px;background:var(--again);color:#fff;font-weight:800;border-radius:99px;padding:3px 9px;font-size:13px}
.rarity-row{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-top:10px}
.card-row{display:flex;gap:10px;flex-wrap:wrap}
.pack-open-stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0;text-align:center}
.pack-tear{cursor:pointer;animation:packbob 1.6s ease-in-out infinite}
.pack-tear.tearing{animation:tear .65s ease-in forwards}
@keyframes tear{0%{transform:scale(1)}30%{transform:scale(1.1) rotate(-6deg)}55%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1.6);opacity:0;filter:brightness(2.5)}}
.pull-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;perspective:1000px}
.flip{width:170px;height:268px;cursor:pointer;animation:dealin .5s ease-out both}
@keyframes dealin{from{transform:translateY(60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center}
.flip .face .wcard{height:100%}
.flip .backside{transform:rotateY(180deg)}
.flip.on.r-rare .backside .wcard{box-shadow:0 0 22px #3b82f6aa}.flip.on.r-epic .backside .wcard{box-shadow:0 0 28px #9b59d0cc}.flip.on.r-legendary .backside .wcard{box-shadow:0 0 36px #f2a516}
.flip:not(.on).r-legendary .front .wcard,.flip:not(.on).r-epic .front .wcard{animation:glowpulse 1.2s ease-in-out infinite}
@keyframes glowpulse{50%{box-shadow:0 0 26px #ffd166}}
.shiny-note{margin-top:6px;font-weight:700;color:var(--hard)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;justify-items:center}
@media (max-width:640px){   /* phones: 6 tiny cards per row so the whole collection takes little scrolling */
  .gallery-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
  .gallery-grid .gal-item{width:100%;min-width:0;display:flex;justify-content:center}
  .gallery-grid .wcard.sm{width:100%;max-width:72px;min-width:0;padding:2px 2px 3px;border-width:1.5px;border-radius:6px;gap:0;box-shadow:none}
  .gallery-grid .wcard.sm .wc-top{font-size:7px;justify-content:center}
  .gallery-grid .wcard.sm .wc-rar{display:none}
  .gallery-grid .wcard.sm .wc-art{font-size:18px;border-radius:4px;aspect-ratio:1/1}
  .gallery-grid .wcard.sm .wc-word{font-size:9px;margin-top:1px;line-height:1.1;max-width:100%;overflow-wrap:anywhere;hyphens:auto}
  .gallery-grid .wcard.sm .wc-reading,.gallery-grid .wcard.sm .wc-en{font-size:7.5px;line-height:1.1;max-width:100%;overflow-wrap:anywhere;hyphens:auto}
  .gallery-grid .wcard.sm .wc-foot{font-size:7px}
  .gallery-grid .wcard.sm .wc-new{top:9px;font-size:6.5px;padding:0 3px}
  .gallery-grid .wcard.sm .wc-num,.gallery-grid .wcard.sm .wc-stars{font-size:7px;line-height:1.25;letter-spacing:0}
}
@media (max-width:340px){ .gallery-grid{grid-template-columns:repeat(5,minmax(0,1fr))} }
.tr-opt.pad-sel,.sg-opt.pad-sel{outline:4px solid #ffd24a;outline-offset:2px;box-shadow:0 0 0 7px rgba(0,0,0,.35)}
/* ---------- Sentence Builder ---------- */
.bld-board{gap:12px;align-items:stretch;text-align:left}
.bld-board>*{width:100%;align-self:stretch}
.bld-line{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border:2px dashed var(--border);border-radius:14px;background:var(--bg)}
.bld-line.done{border-style:solid;border-color:var(--good);background:var(--ok-bg)}
.rs-tabs{display:flex;gap:8px;justify-content:center;margin:0 0 10px}
.rs-en{font-size:1.15em;font-weight:600;margin:6px 0 10px}
.rs-end{font:600 18px var(--font,inherit);color:var(--muted);align-self:flex-end;margin-left:-4px}
.rs-src{margin-top:8px}
.bld-tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.bld-chip{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:8px 14px;border-radius:12px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font:600 18px/1.2 inherit;color:var(--text);box-shadow:0 2px 0 var(--border);transition:transform .08s}
.bld-chip:hover:not([disabled]){transform:translateY(-2px)}
.bld-chip:active:not([disabled]){transform:translateY(1px);box-shadow:none}
.bld-chip .g{font-size:11px;font-weight:500;color:var(--muted)}
/* word types: one color each (chip border, tag and the color key) */
.bld-pos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:10px}
.bld-pos-b{--tc:var(--accent);border:2px solid var(--tc);background:transparent;color:var(--tc);border-radius:99px;padding:3px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.bld-pos-b.on{background:var(--tc);color:#fff}
.t-noun{--tc:#2f6fd6}.t-verb{--tc:#d23b3b}.t-adj{--tc:#1f9a52}.t-pron{--tc:#8a4fd8}.t-det{--tc:#c98a00}.t-prep{--tc:#0f9b8e}.t-conj{--tc:#d6337f}.t-adv{--tc:#5b6b80}.t-part{--tc:#e8590c}
.starter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:8px 10px;border:1px dashed var(--border);border-radius:10px}
.gt-report{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px auto 0;text-align:center}
.gt-lines{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;margin:6px 0 10px;padding:2px}
.gt-line{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:10px;cursor:pointer}.gt-line:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.gt-line span{display:flex;flex-direction:column;gap:2px}.gt-line small{font-size:12px}
.bld-chip[class*=" t-"]{border-color:color-mix(in srgb,var(--tc) 55%,var(--border));box-shadow:0 2px 0 color-mix(in srgb,var(--tc) 45%,var(--border))}
.bld-chip .t{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--tc);border-radius:999px;padding:1px 7px;margin-bottom:2px;line-height:1.4}
.bld-key{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:14px 0 0;font-size:13px}
.bld-key-i{display:inline-flex;align-items:center;gap:5px;color:var(--muted);cursor:help}
.bld-key-i i{width:12px;height:12px;border-radius:4px;background:var(--tc);display:inline-block}
.bld-line .bld-chip{background:var(--surface)}
.bld-line .bld-chip.locked{opacity:1;cursor:default;box-shadow:none}
.bld-line .bld-slot{border-style:dashed;background:transparent;color:var(--tc,var(--muted))}
.bld-line .bld-slot .w{letter-spacing:.1em;opacity:.7}
.bld-line .bld-slot.sel{outline:3px solid var(--accent);outline-offset:2px}
.bld-line .bld-slot.over{outline:3px solid var(--accent);outline-offset:2px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.bld-chip.bad{border-color:var(--again);background:var(--bad-bg);animation:bldshake .35s}
.bld-gap{display:inline-block;width:44px;height:40px;border:2px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.bld-chip.hint{outline:3px solid #ffd24a;outline-offset:2px}
.bld-chip[disabled]{cursor:default}
.bld-chip:not([disabled]){touch-action:none;-webkit-user-select:none;user-select:none}
.bld-chip.dragging{opacity:.3}
.bld-ghost{position:fixed;left:0;top:0;z-index:2000;pointer-events:none;margin:0;opacity:.95;box-shadow:0 10px 24px rgba(0,0,0,.22)!important;transform-origin:center}
body.bld-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
.bld-line.drop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg))}
.bld-mark{display:inline-block;width:5px;height:42px;border-radius:3px;background:var(--accent)}
.bldw-list{max-height:58vh;overflow:auto;margin:0 -4px;padding:0 4px}
.bldw{display:grid;grid-template-columns:1fr minmax(8em,auto);gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.bldw .inp{margin:0;width:auto}
.bldw-f{grid-column:1/-1;display:none;flex-wrap:wrap;gap:6px;align-items:center}
.bldw[data-k=noun] .f-noun,.bldw[data-k=verb] .f-verb,.bldw[data-k=adj] .f-adj{display:flex}
.bldw .pill{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--ok-bg);color:var(--good)}
@keyframes bldshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bld-heat{display:flex;flex-direction:column;gap:4px}
.bld-heat-bar{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,#3a7bf0,#5cc8f2 25%,#cfd8dc 45%,#ffc24a 65%,#ff7a2f 82%,#e8261c)}
.bld-heat-bar i{position:absolute;top:50%;left:var(--to);width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--surface);border:3px solid var(--text);box-shadow:0 2px 6px rgba(0,0,0,.25);animation:bldheat .5s ease-out}
@keyframes bldheat{from{left:var(--from)}to{left:var(--to)}}
.bld-heat-l{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.bld-heat-l b{font-size:14px;color:var(--text)}
.bld-orow{padding:9px 0;border-bottom:1px solid var(--border)}
.bld-ops{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.bld-op{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--tc);border:2px solid var(--tc);border-radius:999px;padding:2px 9px}
.bld-op.bld-opt{background:transparent;color:var(--tc);border-style:dashed}
.bld-arr{color:var(--muted);font-size:13px}
.bld-otips{display:grid;gap:7px;margin-top:12px;font-size:14px}
.bld-otips>div{display:flex;gap:8px;align-items:baseline}
.bld-otips i{flex:none;width:10px;height:10px;border-radius:3px;background:var(--tc);display:inline-block}
.bld-msg{padding:10px 14px;border-radius:12px;font-size:15px}
.bld-msg.no{background:var(--bad-bg)}.bld-msg.ok{background:var(--ok-bg);font-size:17px}.bld-msg.ex{background:var(--surface2)}
.bld-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
@media (max-width:640px){ .bld-chip{font-size:16px;padding:7px 11px} .bld-actions .btn{flex:1 1 auto}
  /* phones: the sentence you build stays on ONE line: the boxes shrink to fit (bldShowEnd), no scrolling */
  .bld-line{flex-wrap:nowrap;overflow:hidden;gap:4px;padding:8px 6px;justify-content:flex-start}
  .bld-line.wrap{flex-wrap:wrap}
  .bld-line.tight .bld-chip .t{display:none}
  .bld-line.tight{gap:3px}
  .bld-line>.muted{white-space:nowrap}
  .bld-line .bld-chip{flex:none;font-size:var(--bf,15px);padding:.3em .45em;border-radius:9px;border-width:2px;line-height:1.15}
  .bld-line.tight .bld-chip{padding:.35em .4em;border-radius:7px}
  .bld-line .bld-chip .t{font-size:max(7px,calc(var(--bf,15px) * .57));padding:0 .45em;margin-bottom:1px}
  .bld-line .bld-gap,.bld-line .bld-mark{flex:none}
}
.quiz-clock{font-weight:700;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap}
.quiz-clock.low{background:var(--bad-bg);color:var(--again);border-color:color-mix(in srgb,var(--again) 40%,var(--border))}
.gal-item{cursor:pointer;transition:transform .15s}
.gal-item:hover{transform:translateY(-4px) rotate(-1deg)}
@media (max-width:640px){ .pack-panel{grid-template-columns:1fr;justify-items:center} .flip{width:140px;height:230px} .flip .wcard{width:140px} }
.palette{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.2);padding:10px;width:204px}
.pal-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.pal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pal-sw{width:100%;aspect-ratio:1;border-radius:9px;border:2px solid rgba(0,0,0,.08);cursor:pointer;transition:transform .1s}
.pal-sw:hover{transform:scale(1.1);border-color:var(--accent)}
.pal-none{margin-top:10px;width:100%;border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:6px;cursor:pointer;font-size:13px}
.pal-none:hover{border-color:var(--accent)}
.palette.pal-big{width:252px;padding:10px 12px 12px} .pal-big .pal-none{margin:0 0 8px}
.pal-grid10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:3px} .pal-grid10.main{margin:6px 0 9px}
.pal-grid10 .pal-sw{border-radius:4px;border:1px solid rgba(0,0,0,.12)} .pal-grid10 .pal-sw:hover{transform:scale(1.18);border-color:var(--text);position:relative;z-index:1}
.pal-sub{font-size:12px;font-weight:700;color:var(--muted);margin:9px 0 5px}
.pal-add{display:grid;place-items:center;aspect-ratio:1;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);font-size:14px;line-height:1;cursor:pointer;position:relative;overflow:hidden}
.pal-add:hover{border-color:var(--accent);color:var(--accent)} .pal-add input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.pal-field{max-width:300px} .pal-field .pal-sw{border-radius:4px;border:1px solid rgba(0,0,0,.12)} .pal-pick{display:block;position:relative;cursor:pointer}
.pal-pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none} .pal-pick:hover{transform:scale(1.15);z-index:1}

.dup-tag{display:inline-block;margin-left:8px;font:700 11px/1.5 system-ui,sans-serif;padding:1px 8px;border-radius:999px;background:#fef3c7;color:#92400e;white-space:nowrap;vertical-align:middle}

.bulk-prev{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface2);margin-top:4px}

/* Word Town */
.wt-setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.wt-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:start}
.wt-board{display:grid;grid-template-columns:1.3fr repeat(5,1fr) 1.3fr;grid-template-rows:1.3fr repeat(5,1fr) 1.3fr;gap:3px;aspect-ratio:1;max-height:calc(100vh - 150px);background:var(--surface2);padding:4px;border-radius:14px;border:1px solid var(--border)}

.wt-name{padding:2px 3px;font-weight:600}
.wt-price{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:3px}
.wt-owner{width:8px;height:8px;border-radius:50%;display:inline-block}
.wt-tokens{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:0}
.wt-token{display:inline-flex;border-radius:50%;background:color-mix(in srgb,var(--pc) 30%,transparent);box-shadow:0 0 0 2px var(--pc);margin:0 -3px;transition:transform .15s}

.wt-center{grid-row:2/7;grid-column:2/7;display:flex;flex-direction:column;gap:8px;padding:10px;overflow:auto;text-align:center}

.wt-dice{display:inline-flex;gap:2px;margin-left:8px}
.wt-die{font-size:34px;line-height:1}
.wt-action{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;flex:1}
.wt-q{width:100%;display:flex;flex-direction:column;gap:8px}
.wt-word{font-size:24px;font-weight:700}
.wt-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.wt-deed{border:2px solid var(--border);border-radius:10px;overflow:hidden;min-width:200px;background:var(--surface)}

.wt-side{display:flex;flex-direction:column;gap:8px}
.wt-pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--border);border-left:6px solid var(--pc)}
.wt-pl.active{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 25%,transparent)}

.wt-money{font-weight:700;white-space:nowrap}
.wt-over{display:flex;flex-direction:column;align-items:center;gap:8px}

@media (max-width:900px){.wt-layout{grid-template-columns:1fr}.wt-setup-grid{grid-template-columns:1fr}.wt-cell{font-size:8.5px}.wt-name{display:none}}
/* Spin & Spell */
.ss-layout{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.ss-wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}

.ss-wheel{width:310px;height:310px;border-radius:50%;box-shadow:0 0 0 6px #f2c14e,0 10px 30px rgba(0,0,0,.25);transition:transform 3.5s cubic-bezier(.12,.7,.18,1)}
.ss-svg{width:100%;height:100%;display:block}
.ss-right{display:flex;flex-direction:column;gap:12px}
.ss-hint{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.ss-board{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;padding:16px;border-radius:16px;background:linear-gradient(160deg,#16a085,#0e6f61);box-shadow:var(--shadow)}

.ss-tile{width:34px;height:44px;border-radius:6px;background:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;color:#1c1b19;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.ss-tile:not(.shown):not(.punct){background:linear-gradient(160deg,#e8f6f3,#cdeee7)}
.ss-tile.shown{animation:pop .35s}
.ss-tile.punct{background:transparent;box-shadow:none;color:#fff;width:auto}
.ss-msg{text-align:center;font-weight:700;min-height:24px}
.ss-keys{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.ss-key{width:36px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer}
.ss-key.vowel{background:color-mix(in srgb,var(--hard) 16%,var(--surface))}
.ss-key:not(:disabled):hover{border-color:var(--accent);transform:translateY(-2px)}
.ss-key:disabled{opacity:.35;cursor:default}
.ss-key.used{opacity:.15;text-decoration:line-through}
@media (max-width:820px){ .ss-layout{grid-template-columns:1fr} .ss-wheel{width:260px;height:260px} .ss-tile{width:26px;height:36px;font-size:18px} }
/* Streak calendar */

.cal-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);vertical-align:middle}
.cal-day.met,.cal-day.frozen{background:color-mix(in srgb,var(--hard) 20%,var(--surface))}
.cal-day.frozen{background:color-mix(in srgb,var(--easy) 18%,var(--surface))}
.cal-day.run-start{border-radius:12px 0 0 12px;margin-right:0}
.cal-day.run-mid{border-radius:0;margin:0}
.cal-day.run-end{border-radius:0 12px 12px 0;margin-left:0}
.cal-day.today .cal-num{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day.future{opacity:.35;cursor:default}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin:10px 0}
.cal-detail{border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--bg)}
.cal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cal-stats div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center;display:flex;flex-direction:column}
.cal-stats b{font-size:20px}.cal-stats span{font-size:11px;color:var(--muted)}
.cal-games{display:flex;flex-direction:column;margin-top:8px}
@media (max-width:640px){ .cal-day{height:44px} .cal-stats{grid-template-columns:repeat(2,1fr)} }
/* Peanut Millionaire */
.pm-layout{display:grid;grid-template-columns:1fr 210px;gap:16px;align-items:start}
.pm-main{display:flex;flex-direction:column;gap:12px}
.pm-lifelines{display:flex;gap:10px;justify-content:center}
.pm-life{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:96px;padding:8px 10px;border-radius:999px;border:2px solid #f2c14e;background:linear-gradient(160deg,#2a1f5c,#1b1442);color:#ffe27a;font-weight:800;font-size:20px;cursor:pointer}
.pm-life span{font-size:11px;font-weight:600;color:#fff}
.pm-life:disabled{opacity:.35;cursor:default;filter:grayscale(1)}
.pm-life:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 0 14px #f2c14e88}
.pm-q{background:linear-gradient(160deg,#2a1f5c,#14103a);color:#fff;border:2px solid #8b7bff;border-radius:22px;padding:18px 22px;text-align:center;box-shadow:0 10px 30px rgba(20,16,58,.35)}
.pm-q .muted{color:#c9c2ff}.pm-q .prompt-label{color:#c9c2ff}
.pm-q .sentence{color:#fff}.pm-q .blank{color:#ffe27a;border-color:#ffe27a}
.pm-word{font-size:34px;font-weight:800}
.pm-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pm-opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:999px;border:2px solid #8b7bff;background:linear-gradient(160deg,#2a1f5c,#1b1442);color:#fff;font-size:17px;font-weight:600;cursor:pointer;text-align:left;min-height:56px}
.pm-opt:hover:not(:disabled){border-color:#ffe27a}
.pm-letter{color:#ffe27a;font-weight:800;position:relative;z-index:1}
.pm-text{position:relative;z-index:1}
.pm-opt.sel{background:linear-gradient(160deg,#6b54ff,#3b2acc);border-color:#ffe27a}
.pm-opt.locked{background:linear-gradient(160deg,#f2a516,#d9840a);border-color:#fff;color:#1b1442;animation:glowpulse 0.6s ease-in-out infinite}
.pm-opt.locked .pm-letter{color:#1b1442}
.pm-opt.right{background:linear-gradient(160deg,#2fbf71,#1f9356);border-color:#fff;animation:pop .4s}
.pm-opt.wrong{background:linear-gradient(160deg,#ef5350,#c62828);border-color:#fff}
.pm-opt.gone{opacity:.25}
.pm-opt:disabled{cursor:default}
.pm-poll{position:absolute;left:0;top:0;bottom:0;background:rgba(255,226,122,.28);z-index:0}
.pm-pct{position:absolute;right:16px;font-size:13px;color:#ffe27a;z-index:1}
.pm-msg{text-align:center;font-weight:700;font-size:17px}
.pm-msg.ok{color:var(--good)}
.pm-ladder{list-style:none;margin:0;padding:10px;border-radius:18px;background:linear-gradient(160deg,#2a1f5c,#14103a);color:#c9c2ff;display:flex;flex-direction:column;gap:3px}
.pm-ladder li{display:flex;justify-content:space-between;padding:3px 10px;border-radius:999px;font-size:14px;font-variant-numeric:tabular-nums}
.pm-ladder li span{opacity:.7}
.pm-ladder li.safe{color:#fff}.pm-ladder li.safe b{color:#ffe27a}
.pm-ladder li.done{color:#7d74c7}
.pm-ladder li.cur{background:#f2a516;color:#1b1442}.pm-ladder li.cur b{color:#1b1442}
@media (max-width:760px){ .pm-layout{grid-template-columns:1fr} .pm-ladder{display:grid;grid-template-columns:repeat(3,1fr)} .pm-opts{grid-template-columns:1fr} }
/* Word Showdown */
.sd-score{margin-left:auto;font-size:26px;font-weight:800;color:var(--pc);font-variant-numeric:tabular-nums}
.sd-board{display:grid;gap:8px;margin-top:6px}

.sd-tile:hover:not(:disabled){transform:translateY(-3px) scale(1.03);filter:brightness(1.1)}
.sd-tile:disabled{cursor:default;opacity:.7}
.sd-tile.used{display:grid;place-items:center;height:70px;border-radius:12px;background:color-mix(in srgb,var(--pc,var(--muted)) 15%,var(--surface2));color:var(--pc,var(--muted));font-size:24px;font-weight:800}
.sd-q{background:var(--surface);border:3px solid var(--pc,var(--accent));border-radius:18px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.sd-q.dd{border-color:#f2a516;background:linear-gradient(160deg,var(--surface),color-mix(in srgb,#f2a516 18%,var(--surface)))}
.sd-dd{font-size:28px;font-weight:900;color:#e08a00;letter-spacing:.04em;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

.sd-decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;padding-left:26px}
@media (max-width:640px){ .sd-tile,.sd-tile.used{height:52px;font-size:20px} .sd-cat{font-size:11px;min-height:54px} }
/* Word Tower */
.tw-players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tw-player{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--border);transition:.2s}
.tw-player .tw-dot{width:16px;height:16px;border-radius:50%;background:var(--pc);flex:none}
.tw-player.active{border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 22%,transparent);transform:translateY(-2px)}
.tw-player.winner{border-color:var(--good);background:var(--ok-bg)}
.tw-prompt{text-align:center;background:var(--surface);border:2px solid var(--pc);border-radius:16px;padding:10px 16px;margin:0 auto 14px;max-width:520px;box-shadow:var(--shadow)}
.tw-word{font-size:30px;font-weight:800}
.tw-timer{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.tw-timer div{height:100%;background:var(--accent);transition:width .1s linear}
.tw-timer div.low{background:var(--again)}
.tw-over{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-bottom:14px}

.tower-stage{display:flex;flex-direction:column;align-items:center;padding:10px 0 0;overflow:hidden}
.tower{display:flex;flex-direction:column;gap:3px;width:min(480px,100%);transform-origin:50% 100%;animation:sway var(--wobdur,3s) ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(calc(var(--wob,0deg) * -1))}50%{transform:rotate(var(--wob,0deg))}}
.tower.crashing{animation:none}
.trow{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tblock{height:38px;border-radius:5px;border:1px solid rgba(90,55,20,.45);background:linear-gradient(180deg,#e8c28a,#d4a462 55%,#c79354);color:#3a2410;font-weight:700;font-size:13px;cursor:pointer;padding:0 6px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 rgba(90,55,20,.35);position:relative;transition:transform .15s,filter .15s}
.trow.alt .tblock{background:linear-gradient(180deg,#e2b77a,#cc9a58 55%,#bd8a4b)}
.tblock::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(120,70,20,.08) 22px 24px);pointer-events:none}
.tblock span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.tblock:not(.locked):not(.gap):not(.ghost):hover{transform:translateY(-3px) scale(1.03);filter:brightness(1.08);box-shadow:0 0 0 3px var(--accent),0 6px 12px rgba(0,0,0,.2)}
.tblock.locked{cursor:not-allowed;filter:saturate(.6) brightness(.9)}
.tblock.gap{background:transparent;border:1px dashed rgba(120,80,40,.25);box-shadow:none;cursor:default}
.tblock.ghost{background:transparent;border:0;box-shadow:none}
.tblock.pulled{transform:translateX(130%) rotate(4deg)!important;opacity:0;transition:transform .45s ease-in,opacity .45s ease-in}
.tblock.fresh{animation:dropin .45s cubic-bezier(.3,1.5,.6,1)}
@keyframes dropin{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.tblock.fallen{cursor:default;filter:saturate(.8)}
.tblock.gap.fallen,.tower.crashing .tblock.gap{visibility:hidden}
.tblock.wrong{background:linear-gradient(180deg,#ff8a80,#e05a50);color:#fff}
.tower-base{width:min(520px,100%);height:14px;border-radius:6px;background:linear-gradient(180deg,#8b5a2b,#6b4321);margin-top:2px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
@media (max-width:640px){ .tw-players{grid-template-columns:1fr} .tblock{font-size:11px;height:34px} }

/* card text tools (cardfmt.js): alignment, lists, focus. Alignment only shows on the card itself; lists of cards and game tiles ignore it. */
.al{display:contents}
.flash .word .al,.pv-side .al{display:block} .al-left{text-align:left} .al-right{text-align:right}
.flash .side:has(>.word .al){width:100%} .flash .side:has(>.word .al)>.word{flex:1;min-width:0}
.flash .side:has(>.speak):has(>.word .al){grid-template-columns:minmax(0,1fr) auto} .flash .side:has(>.speak):has(>.word .al)>.word{grid-column:1} .flash .side:has(>.speak):has(>.word .al)>.speak{grid-column:2}
.pv-side:has(.al)>.rich{width:100%}
:is(ul,ol)[data-list]{width:fit-content;max-width:100%;margin:.25em auto;padding:0 0 0 1.4em;text-align:left;list-style-position:outside;white-space:normal}
ul[data-list=bullet]{list-style-type:disc} ul[data-list=dash]{list-style-type:'–\00a0\00a0'} ol[data-list=num]{list-style-type:decimal}
.al-left>:is(ul,ol)[data-list],.ed-area[data-align=left] :is(ul,ol)[data-list],table.cards :is(ul,ol)[data-list]{margin-left:0} .al-right>:is(ul,ol)[data-list],.ed-area[data-align=right] :is(ul,ol)[data-list]{margin-right:0}
.ed-area{text-align:center}.ed-area[data-align=left]{text-align:left}.ed-area[data-align=right]{text-align:right}
.ed-tools .tool:is([data-act=edList],[data-act=edAlign]) svg{color:var(--text)} .ed-tools .tool.cf-on{background:var(--accent-soft)} .ed-tools .tool[data-act=edCase]{font-size:13px;font-weight:600}
[data-focus],.fm4{background:color-mix(in srgb,var(--accent) 20%,transparent);border-bottom:2px solid var(--accent);border-radius:3px}
.pv-side .rich:has(:is([data-focus="1"],[data-focus="3"],[data-focus="4"])){color:var(--muted)} .pv-side [data-focus]{color:var(--text)}
[data-focus="3"],.fm3{background:color-mix(in srgb,#f5c211 26%,transparent);border-bottom:2px dashed #b88a00;border-radius:3px} .ed-area[data-fmode="1"] [data-focus="3"]{background:color-mix(in srgb,var(--accent) 20%,transparent);border-bottom:2px solid var(--accent)} .ed-area[data-fmode="2"]:has([data-focus]:not([data-focus="3"])) [data-focus="3"]{background:none;border:0} .fm{padding:0 4px}
.ed-fmark{display:none;width:100%;align-items:center;gap:8px;flex-wrap:wrap} .ed-area[data-fmode="3"]~.ed-focus .ed-fmark{display:flex}
.ed-focus{display:none;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;font-weight:400;color:var(--muted)} .ed-focus .seg-mini{flex-wrap:wrap} .ed-focus .seg-mini button{font-size:12.5px;text-align:left} .ed-focus .seg-mini button.on{background:var(--accent-soft)} .editor:has(.ed-area [data-focus])>.ed-focus{display:flex}
.flash .word img,.flash .side img{display:block;max-width:100%;max-height:280px;margin:8px auto;border-radius:12px}
.rich img{max-height:48px;max-width:90px;border-radius:6px;vertical-align:middle}
.mtile img{display:block;max-height:80px;max-width:100%;margin:0 auto;border-radius:8px}
.feat{border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.feat h4{margin:0 0 8px;font-size:14px}
.feat .check+.check{margin-top:8px}

/* Games */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.game-card .emoji{font-size:30px;line-height:1}
.game-card .btn{margin-top:auto}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mtile{border:1px solid var(--border);border-bottom-width:3px;border-radius:12px;background:var(--surface);padding:14px;font-size:17px;cursor:pointer;text-align:center;min-height:56px;transition:transform .1s,background .15s,opacity .3s}
.mtile:hover:not(:disabled){border-color:var(--accent)}
.mtile.sel{border-color:var(--accent);background:var(--accent-soft)}
.mtile.done{opacity:0;pointer-events:none}
.mtile.wrong{border-color:var(--again);background:var(--bad-bg);animation:shake .35s}
.mtile.right{border-color:var(--good);background:var(--ok-bg)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.tile{min-width:44px;height:46px;padding:0 14px;border:1px solid var(--border);border-bottom-width:3px;border-radius:10px;background:var(--surface);font-size:18px;cursor:pointer}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile.used{visibility:hidden}
.tile:disabled{cursor:default}
.answer-line{min-height:66px;border-bottom:2px dashed var(--border);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;padding:8px 0;margin:18px 0 14px}
.answer-line.ok{border-color:var(--good)} .answer-line.bad{border-color:var(--again)}
.answer-line .hint{color:var(--muted);font-size:14px;align-self:center}
.sentence{font-size:clamp(20px,3.4vw,28px);font-weight:500;line-height:1.5}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);color:var(--accent);font-weight:700;text-align:center}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}

@media (max-width:640px){
  .stats,.stats.six{grid-template-columns:repeat(2,1fr)}
  .grid2,.options{grid-template-columns:1fr}
  .rate{grid-template-columns:repeat(2,1fr)}
  .set-row{flex-direction:column;align-items:stretch}
  .set-row select{min-width:0;max-width:none}
  table.cards .hide-sm{display:none}
}
/* Phones and tablets */

  table.cards{table-layout:fixed}
  table.cards th.sel{width:30px} table.cards th.act{width:60px}

}
